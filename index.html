/* ========================================================
 *  Розмови
 * ======================================================== */
const CALL_TABS = [
  { key:"all",        label:"Усі",          match: c => true },
  { key:"done",       label:"Готово",       match: c => c.status==="done" },
  { key:"live",       label:"В ефірі",      adminOnly:true, match: c => c.status==="live" },
  { key:"working",    label:"В роботі",     match: c => ["queued","ended","queued_for_analysis","transcribed","downloading","transcribing","analyzing"].includes(c.status) || (c.status==="live" && isMgrView()) },
  { key:"idle",       label:"Не оброблено", adminOnly:true, match: c => ["idle","canceled","skipped_short","error"].includes(c.status) },
];
// Тестові копії (порівняння моделей ІІ) живуть лише у вкладці «Тест» і не переходять в інші вкладки.
CALL_TABS.forEach(t => { const m = t.match; t.match = c => !c.isTest && m(c); });
function isMgrView(){ return !!(activeUser && activeUser.role===ROLES.MANAGER); }
function callTabs(){ return CALL_TABS.filter(t => !t.adminOnly || !isMgrView()); }
const callsState = { tab:(function(){ try{ return localStorage.getItem("alexa_calls_tab")||"all"; }catch(_){ return "all"; } })(), search:"", manager:"all", from:(function(){ const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })(), to:new Date(), limit:20 };  // за замовчуванням: поточний місяць

// Перехід у «Розмови» з уже виставленими фільтрами (з Огляду / Прогресу)
function saveCallsTab(){ try{ localStorage.setItem("alexa_calls_tab", callsState.tab); }catch(_){} }
function goToCalls(o){
  o = o || {};
  callsState.tab = o.tab || "all"; saveCallsTab();
  callsState.manager = o.manager || "all";
  callsState.search = "";
  callsState.limit = 20;
  if (o.period==="custom"){ callsState.from = o.from||null; callsState.to = o.to||null; }
  else if (o.period && o.period!=="all"){ callsState.from = periodStart(o.period); callsState.to = new Date(); }
  else { callsState.from = null; callsState.to = null; }
  location.hash = "#/calls";
}

function renderCalls(root){
  if (!callTabs().some(t=>t.key===callsState.tab)) { callsState.tab = callTabs()[0].key; saveCallsTab(); }
  const tabCounts = {};
  callTabs().forEach(t => tabCounts[t.key] = callsAll().filter(t.match).length);

  const tabs = el("div",{class:"tabs"},
    callTabs().map(t => el("button",
      { class: t.key===callsState.tab?"is-active":"",
        onclick: () => { callsState.tab=t.key; saveCallsTab(); callsState.limit=20; renderCalls(root); } },
      t.label, el("span",{class:"tab-count","data-k":t.key}, String(tabCounts[t.key]))))
  );

  const search = el("input",{type:"text",placeholder:"Пошук за клієнтом...",class:"input input--search",value:callsState.search,
    oninput:(e)=>{ callsState.search = e.target.value.toLowerCase(); updateList(); }});

  // Менеджер бачить у dropdown лише себе; адмін+ бачить усіх.
  const isManagerRole = activeUser && activeUser.role===ROLES.MANAGER;
  if (isManagerRole) callsState.manager = activeUser.email;
  const mgrOptions = isManagerRole
    ? [{ value: activeUser.email, label: activeUser.name || activeUser.email, name: activeUser.name, email: activeUser.email, photoURL: activeUser.photoURL||null }]
    : [{ value:"all", label:"Усі менеджери", name:"Усі менеджери", photoURL:null }].concat(
        managersList().map(m => ({ value:m.email, label:m.name||m.email, name:m.name, email:m.email, photoURL:m.photoURL||null }))
      );
  const mgrDD = dropdown({
    value: callsState.manager, options: mgrOptions,
    onChange: v => { callsState.manager=v; updateList(); },
    renderButton: o => el("span",{class:"dd__btn-left"},
      o.value==="all" ? el("div",{class:"ava ava--sm",style:"background:var(--surface-2);color:var(--text-muted);"}, ICONS.users()) : userAva(o,"sm"),
      el("span",{class:"dd__btn-label"}, o.label)),
    renderItem: o => el("div",{style:"display:flex;align-items:center;gap:10px;flex:1;"},
      o.value==="all" ? el("div",{class:"ava ava--sm",style:"background:var(--surface-2);color:var(--text-muted);"}, ICONS.users()) : userAva(o,"sm"),
      el("span",{}, o.label)),
  });

  // Styled date range
  const dateDD = dateRangeBtn({ start: callsState.from, end: callsState.to,
    defaultRange: () => { const d=new Date(); return { start:new Date(d.getFullYear(), d.getMonth(), 1), end:d }; },
    onChange: ({start,end}) => { callsState.from=start; callsState.to=end; updateList(); } });

  const addBtn = el("button",{class:"btn btn-primary", onclick:()=>{ location.hash = "#/calls/new"; }}, ICONS.plus(), "Додати розмову");

  const listWrap = el("div",{});
  // Auto-refresh when worker updates calls (store on window to dedupe across re-renders)
  if (window.__callsListener) window.removeEventListener(CALLS_CHANGED_EVT, window.__callsListener);
  let lastSig = callsSig();
  window.__callsListener = ()=>{
    const s = callsSig(); if (s === lastSig) return; lastSig = s;
    try { if (document.body.contains(root) && document.body.contains(listWrap)) updateList(); } catch(e){}
  };
  window.addEventListener(CALLS_CHANGED_EVT, window.__callsListener);

  function updateList(){
    const tabMatch = (callTabs().find(t=>t.key===callsState.tab)||callTabs()[0]).match;
    const from = callsState.from ? new Date(callsState.from.getFullYear(),callsState.from.getMonth(),callsState.from.getDate(),0,0,0) : null;
    const to   = callsState.to   ? new Date(callsState.to.getFullYear(),callsState.to.getMonth(),callsState.to.getDate(),23,59,59)    : null;
    const base = callsAll().filter(c => {
      if (callsState.manager!=="all" && c.managerEmail!==callsState.manager) return false;
      if (callsState.search && !(c.client||c.title||"").toLowerCase().includes(callsState.search)) return false;
      const t = new Date(c.startedAt).getTime();
      if (from && t<from.getTime()) return false;
      if (to && t>to.getTime()) return false;
      return true;
    });
    // счётчики вкладок = по тем же фильтрам (менеджер / поиск / дата), что и список
    callTabs().forEach(t => {
      const n = tabs.querySelector('.tab-count[data-k="'+t.key+'"]');
      if (n) n.textContent = String(base.filter(t.match).length);
    });
    const byStart = (a,b)=> new Date(b.startedAt)-new Date(a.startedAt);
    const list = base.filter(tabMatch).sort(byStart);

    listWrap.replaceChildren();
    if (list.length===0){
      listWrap.appendChild(el("div",{class:"calls-empty"}, "Нічого не знайдено за заданими фільтрами."));
      return;
    }

    const head = el("div",{class:"calls-head calls-grid"},
      el("div",{},"Дата / час"),
      el("div",{},"Менеджер"),
      el("div",{},"Клієнт"),
      el("div",{},"Діалог"),
      el("div",{},"Статус"),
      el("div",{style:"text-align:right;"},"Оцінка"),
      el("div",{},"")
    );
    listWrap.appendChild(head);

    for (const c of list.slice(0, callsState.limit)){
      const mgr = userByEmail(c.managerEmail);
      const score = c.score;
      const dur = c.durationSec ? fmtDur(c.durationSec) : null;
      const row = el("div",{class:"calls-row calls-grid", onclick: ()=>{ location.hash = "#/calls/"+c.id; }},
        el("div",{class:"calls-row__cell"},
          el("div",{style:"font-weight:500;"}, fmtDate(c.startedAt)),
          el("div",{class:"muted xs"}, fmtTimeRange(c.startedAt, c.durationSec, c.status))),
        el("div",{class:"calls-row__cell"},
          el("div",{style:"display:flex;align-items:center;gap:10px;min-width:0;"},
            userAva(mgr,"sm"),
            el("div",{class:"truncate",style:"font-weight:500;overflow:hidden;text-overflow:ellipsis;"}, mgr.name||mgr.email.split("@")[0]))),
        el("div",{class:"calls-row__cell truncate",style:"font-weight:500;"}, c.client || c.title || "(без назви)"),
        el("div",{class:"calls-row__cell truncate muted small"},
          (c.source==="youtube_watcher" ? "▶ YouTube · " : "✎ Вручну · ") + (c.summaryShort || c.summary || c.errorReason || c.title || "—")),
        el("div",{class:"calls-row__cell",style:"display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow:visible;position:relative;"}, statusBadge(c.status),
          PROC_STATES.includes(c.status) ? el("span",{class:"muted xs", style:"font-variant-numeric:tabular-nums;"}, progressPct(c)+"%") : null,
          PROC_STATES.includes(c.status) ? el("div",{class:"pbar pbar--mini"}, el("span",{style:"width:"+progressPct(c)+"%"})) : null,
          (aiAllowed() && ["idle","canceled","error","transcribed"].includes(c.status)) ? el("button",{class:"btn btn-primary btn-sm calls-act", title:(c.transcriptReady?"Зробити аналіз":"Почати аналіз"),
            onclick: async (e)=>{ e.stopPropagation(); const b=e.currentTarget; b.disabled=true;
              try { const ok = await startCallAnalysis(c); if (ok) toast("Поставлено в чергу","ok"); else b.disabled=false; }
              catch(ex){ toast(ex.code||ex.message||String(ex),"err"); b.disabled=false; } } }, "▶") : null,
          ["queued","queued_for_analysis","ended","downloading","transcribing","analyzing"].includes(c.status) ? el("button",{class:"btn btn-ghost btn-sm calls-act", title:"Скасувати",
            onclick: async (e)=>{ e.stopPropagation(); const b=e.currentTarget; b.disabled=true;
              try { await cancelCall(c); toast("Скасовано","ok"); }
              catch(ex){ toast(ex.code||ex.message||String(ex),"err"); b.disabled=false; } } }, "✕") : null),
        el("div",{class:"calls-row__cell",style:"display:flex;justify-content:flex-end;align-items:center;"}, score!=null ? scoreRing(score, 40) : el("span",{class:"muted"},"—")),
        el("div",{style:"color:var(--text-faint);text-align:right;"}, ICONS.chevronRight())
      );
      listWrap.appendChild(row);
    }
    if (list.length > callsState.limit){
      listWrap.appendChild(el("div",{style:"text-align:center;margin-top:12px;"},
        el("button",{class:"btn btn-ghost", onclick:()=>{ callsState.limit += 20; updateList(); }},
          "Показати ще (" + (list.length - callsState.limit) + ")")));
    }
  }

  root.replaceChildren(
    el("div",{class:"page-header"},
      el("h1",{class:"page-title"},"Розмови"),
      addBtn),
    el("div",{style:"margin-bottom:var(--s-4);"}, tabs),
    el("div",{class:"filters"}, search, mgrDD, dateDD),
    listWrap
  );
  updateList();
}

/* ========================================================
 *  Мій прогрес
 * ======================================================== */
const PROGRESS_PREF_KEY = "alexa_progress_pref";
const progressState = (function(){
  try { const sv = JSON.parse(localStorage.getItem(PROGRESS_PREF_KEY)||"null"); if (sv && typeof sv==="object") return Object.assign({ who:"all", period:"month", from:null, to:null }, sv, { from: sv.from?new Date(sv.from):null, to: sv.to?new Date(sv.to):null }); } catch(_){}
  return { who:"all", period:"month", from:null, to:null };
})();
function saveProgressPref(){
  try { localStorage.setItem(PROGRESS_PREF_KEY, JSON.stringify({ who: progressState.who, period: progressState.period, from: progressState.from?progressState.from.toISOString():null, to: progressState.to?progressState.to.toISOString():null })); } catch(_){}
}
const PERIODS_PROG = [
  { key:"today", label:"Сьогодні" },
  { key:"week",  label:"Тиждень" },
  { key:"month", label:"Місяць" },
  { key:"year",  label:"Рік" },
  { key:"all",   label:"Весь час" },
];

const MOCK_TEAM_PROGRESS = {
  "all": { callsCount:0, avgScore:0, weekDelta:0, topWeak:[], criteria:[] },
};
const MOCK_MGR_SCORES = [];

function renderProgress(root){
  const isManager = activeUser && activeUser.role===ROLES.MANAGER;
  const title = isManager ? "Мій прогрес" : "Прогрес";
  const who = isManager ? activeUser.email : progressState.who;
  const data = (function(){
    let from = periodStart(progressState.period), to = new Date(8640000000000000);
    if (progressState.period==="custom" && progressState.from && progressState.to) { from = progressState.from; to = new Date(progressState.to.getTime()+86400000); }
    const mine = callsAll().filter(c => isManager || who==="all" || c.managerEmail===who);
    const inP = mine.filter(c => { const t=new Date(c.startedAt); return t>=from && t<to; });
    const sc = inP.filter(c => c.status==="done" && !c.isTest && isFullCall(c) && typeof c.score==="number").map(c=>c.score);
    const avg = a => a.length ? Math.round(a.reduce((x,y)=>x+y,0)/a.length) : 0;
    const now = Date.now(), W = 7*86400000;
    const sw = (a,b) => mine.filter(c => c.status==="done" && !c.isTest && isFullCall(c) && typeof c.score==="number" && now-b<=new Date(c.startedAt) && new Date(c.startedAt)<now-a).map(c=>c.score);
    const cur = sw(0,W), prev = sw(W,2*W);
    // попередній період такої ж довжини (для динаміки по критеріях)
    let prevCalls = [];
    if (progressState.period !== "all") {
      const LEN = { today:1, week:7, month:30, year:365 };
      const lenMs = progressState.period==="custom" ? (to - from) : (LEN[progressState.period]||0)*86400000;
      if (lenMs > 0 && lenMs < 3e12) { const pf = new Date(from.getTime() - lenMs); prevCalls = mine.filter(c => { const t=new Date(c.startedAt); return t>=pf && t<from; }); }
    }
    return { inP, mine, prevCalls, callsCount: inP.length, avgScore: avg(sc), weekDelta: (cur.length&&prev.length) ? avg(cur)-avg(prev) : 0, topWeak:[], criteria:[] };
  })();

  // period segmented
  const periodSeg = el("div",{class:"period-seg"},
    PERIODS_PROG.map(p => el("button",{
      class: progressState.period===p.key?"is-active":"",
      onclick: ()=>{ progressState.period=p.key; progressState.from=null; progressState.to=null; saveProgressPref(); renderProgress(root); }
    }, p.label)));

  // custom date range (parallel to seg)
  const presetRange = (progressState.period==="custom" || progressState.period==="all") ? null : { s: periodStart(progressState.period), e: new Date() };
  const dateDD = dateRangeBtn({ start: presetRange ? presetRange.s : progressState.from, end: presetRange ? presetRange.e : progressState.to,
    defaultRange: () => { const d=new Date(); return { start:new Date(d.getFullYear(), d.getMonth(), 1), end:d }; },
    onChange: ({start,end})=>{ progressState.from=start; progressState.to=end; progressState.period="custom"; saveProgressPref(); renderProgress(root); }});

  // picker (admins)
  let picker = null;
  if (!isManager){
    const opts = [{ value:"all", label:"Усі менеджери" }].concat(managersList().map(m => ({ value:m.email, label:m.name||m.email, name:m.name, email:m.email, photoURL:m.photoURL||null })));
    picker = dropdown({
      value: progressState.who, options: opts,
      onChange: v => { progressState.who = v; saveProgressPref(); renderProgress(root); },
      renderButton: o => el("span",{class:"dd__btn-left"},
        o.value==="all" ? el("div",{class:"ava ava--sm",style:"background:var(--surface-2);color:var(--text-muted);"}, ICONS.users()) : userAva(o,"sm"),
        el("span",{class:"dd__btn-label"}, o.label)),
      renderItem: o => el("div",{style:"display:flex;align-items:center;gap:10px;flex:1;"},
        o.value==="all" ? el("div",{class:"ava ava--sm",style:"background:var(--surface-2);color:var(--text-muted);"}, ICONS.users()) : userAva(o,"sm"),
        el("span",{}, o.label)),
    });
  }

  const whoLabel = isManager ? "по тобі" : (progressState.who==="all" ? "по всій команді" : "по " + ((MOCK_MANAGERS.find(m=>m.email===progressState.who)||{}).name || progressState.who));
  const periodLbl = progressState.period==="custom"
    ? (progressState.from && progressState.to ? fmtDateShort(progressState.from)+" — "+fmtDateShort(progressState.to) : "довільний період")
    : (PERIODS_PROG.find(p=>p.key===progressState.period)||PERIODS_PROG[2]).label.toLowerCase();

  const scoreColor = data.avgScore>=80?"var(--success)":data.avgScore>=60?"var(--warn)":"var(--danger)";
  const deltaColor = data.weekDelta>=0?"var(--success)":"var(--danger)";
  const deltaSign  = data.weekDelta>=0?"+":"";

  // Team-only block: managers list (реальні дані)
  const avgOf = a => a.length ? Math.round(a.reduce((x,y)=>x+y,0)/a.length) : 0;
  const mgrRows = (function(){
    if (isManager || progressState.who!=="all") return [];
    const now = Date.now(), W = 7*86400000;
    return managersList().map(m => {
      const all = data.mine.filter(c => c.managerEmail===m.email);
      const inP = data.inP.filter(c => c.managerEmail===m.email);
      const sc = inP.filter(c=>c.status==="done" && !c.isTest && isFullCall(c) && typeof c.score==="number").map(c=>c.score);
      const wk = (a,b) => all.filter(c=>c.status==="done" && !c.isTest && isFullCall(c) && typeof c.score==="number" && now-b<=new Date(c.startedAt) && new Date(c.startedAt)<now-a).map(c=>c.score);
      const cur = wk(0,W), prev = wk(W,2*W);
      return { email:m.email, calls:inP.length, avg:avgOf(sc), has:sc.length>0, delta:(cur.length&&prev.length)?avgOf(cur)-avgOf(prev):0 };
    }).filter(r=>r.calls>0).sort((a,b)=>b.avg-a.avg);
  })();
  const mgrListBlock = (!isManager && progressState.who==="all") ? el("div",{class:"card"},
    el("div",{class:"section-title"}, el("span",{},"Менеджери команди"), el("span",{class:"muted xs"},"клік → прогрес менеджера")),
    el("div",{}, mgrRows.length===0 ? el("div",{class:"empty"},"За цей період розмов немає.") :
    mgrRows.map(ms => {
      const mgr = userByEmail(ms.email);
      const col = ms.avg>=80?"var(--success)":ms.avg>=60?"var(--warn)":"var(--danger)";
      const dcol = ms.delta>=0?"var(--success)":"var(--danger)";
      return el("div",{class:"list-row", onclick: ()=>{ progressState.who=ms.email; saveProgressPref(); renderProgress(root); }},
        userAva(mgr),
        el("div",{},
          el("div",{class:"list-row__name"}, mgr.name||mgr.email),
          el("div",{class:"list-row__sub"}, ms.calls+" розмов · середня оцінка (повні діагностики)")),
        el("div",{style:"display:flex;align-items:center;gap:12px;"},
          el("span",{style:"font-weight:700;font-size:16px;color:"+(ms.has?col:"var(--text-muted)")+";"}, ms.has?ms.avg+"%":"—"),
          el("span",{style:"color:"+dcol+";font-weight:600;font-size:12px;"}, (ms.delta>=0?"+":"")+ms.delta+"%"),
          ICONS.chevronRight()));
    }))
  ) : null;

  // Розмови періоду (для одного менеджера / мого прогресу)
  const callsBlock = mgrListBlock ? null : (function(){
    const rows = data.inP.slice().sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt)).slice(0,10);
    return el("div",{class:"card"},
      el("div",{class:"section-title"}, el("span",{},"Розмови за "+periodLbl),
        el("button",{class:"btn btn-ghost btn-sm", onclick:()=>goToCalls({period:progressState.period, from:progressState.from, to:progressState.to, manager: isManager?"all":who, tab:"all"})}, "Усі розмови →")),
      el("div",{}, rows.length===0 ? el("div",{class:"empty"},"За цей період розмов немає.") :
        rows.map(c => el("div",{class:"list-row", onclick:()=>{ location.hash="#/calls/"+c.id; }},
          userAva(userByEmail(c.managerEmail)),
          el("div",{},
            el("div",{class:"list-row__name"}, c.client || c.title || "(без назви)"),
            el("div",{class:"list-row__sub"}, fmtDate(c.startedAt)+" · "+fmtTimeRange(c.startedAt, c.durationSec, c.status))),
          el("div",{style:"display:flex;align-items:center;gap:12px;"},
            statusBadge(c.status),
            c.score!=null ? scoreRing(c.score, 40) : el("span",{class:"muted"},"—"),
            ICONS.chevronRight())))));
  })();

  // Слабкі місця ТОП-5 і прогрес по критеріях — з реальних аналізів
  const weakCard = el("div",{class:"card"});
  const critCard = el("div",{class:"card"});
  let critOpen = false, lastArgs = [];
  function paintAnalytics(list, loading, prevList){
    lastArgs = [list, loading, prevList];
    const wk = new Map(), cr = new Map();
    list.forEach(({a}) => {
      const seen = new Set();
      (a.weaknesses||[]).forEach(w => { const k = w.criterion || w.title || ""; if (k) seen.add(k); });
      seen.forEach(k => wk.set(k, (wk.get(k)||0)+1));
      (a.criteria||[]).forEach(c => { const k = c.name||c.title||""; if (!k || c.score==null) return; const o = cr.get(k)||{sum:0,n:0}; o.sum += Number(c.score)||0; o.n++; cr.set(k,o); });
    });
    const topWeak = [...wk.entries()].sort((x,y)=>y[1]-x[1]).slice(0,5).map(([label,cnt]) => ({label, cnt, pct: Math.round(cnt/Math.max(list.length,1)*100)}));
    const prevCr = new Map();
    (prevList||[]).forEach(({a}) => (a.criteria||[]).forEach(c => { const k = c.name||c.title||""; if (!k || c.score==null) return; const o = prevCr.get(k)||{sum:0,n:0}; o.sum += Number(c.score)||0; o.n++; prevCr.set(k,o); }));
    const crit = [...cr.entries()].map(([name,o]) => { const pv = prevCr.get(name); return {name, n:o.n, pct:Math.round(o.sum/o.n), delta: pv ? Math.round(o.sum/o.n) - Math.round(pv.sum/pv.n) : null}; }).sort((x,y)=>y.n-x.n||x.name.localeCompare(y.name));
    const empty = txt => el("div",{class:"empty"}, loading ? "Завантаження…" : txt);
    const noCritTxt = list.length ? "У розмов за цей період немає оцінки по критеріях." : "За цей період немає розібраних розмов.";
    weakCard.replaceChildren(
      el("div",{class:"section-title"}, el("span",{},"Слабкі місця · ТОП-5"), el("span",{class:"muted xs"},"повторюються з розмови в розмову")),
      el("div",{}, topWeak.length ? topWeak.map(w => el("div",{style:"margin-bottom:14px;"},
        el("div",{style:"display:flex;justify-content:space-between;margin-bottom:6px;"},
          el("span",{style:"font-weight:500;font-size:13.5px;"}, w.label),
          el("span",{class:"muted xs"}, w.cnt+" з "+list.length+" розмов")),
        el("div",{class:"bar"}, el("span",{style:"width:"+w.pct+"%;background:linear-gradient(90deg,var(--danger),var(--warn));"}))
      )) : empty("За цей період немає розібраних розмов.")));
    critCard.replaceChildren(
      el("div",{class:"section-title"}, el("span",{},"Прогрес по критеріях скрипта"), el("span",{class:"muted xs"}, progressState.period==="all" ? "середній бал" : "середній бал · зміна до попереднього періоду")),
      el("div",{}, crit.length ? (critOpen ? crit : crit.slice(0,7)).map(c => el("div",{style:"margin-bottom:14px;"},
        el("div",{style:"display:flex;justify-content:space-between;margin-bottom:6px;"},
          el("span",{style:"font-weight:500;font-size:13.5px;"}, c.name),
          el("span",{class:"muted xs"}, c.pct+"% · "+c.n+" розмов",
            c.delta===null ? null : el("b",{style:"margin-left:8px;color:"+(c.delta>0?"var(--success)":c.delta<0?"var(--danger)":"var(--text-muted)")+";"}, (c.delta>0?"▲ +":c.delta<0?"▼ ":"= ")+(c.delta!==0?c.delta:"0")))),
        el("div",{class:"bar"}, el("span",{style:"width:"+c.pct+"%;background:"+(c.pct>=80?"linear-gradient(90deg,var(--success),#16A34A)":c.pct>=60?"linear-gradient(90deg,var(--warn),#D97706)":"linear-gradient(90deg,var(--danger),#DC2626)")+";"}))
      )).concat(crit.length>7 ? [el("button",{class:"btn btn-ghost btn-sm", onclick:()=>{ critOpen=!critOpen; paintAnalytics(...lastArgs); }}, critOpen ? "Згорнути" : "Показати решту ("+(crit.length-7)+")")] : []) : empty(noCritTxt)));
  }
  paintAnalytics([], true);

ейсом схожої людини (з показом профілю/переписки).\n• Заперечення «немає грошей» — акцент на українцях за кордоном (Європа, Канада, США), більші чеки.\n• Ціни не називати до закриття всіх питань і заперечень.", "criteria": [{"title": "Підготовка", "description": "Менеджер знає клієнта: профіль, історію контактів, попередні домовленості, мету зустрічі.", "weight": 10}, {"title": "Контакт", "description": "Приємний старт, на «ти», комфортна атмосфера, чітка рамка часу і мети зустрічі.", "weight": 10}, {"title": "Запит і потреби", "description": "Відкриті питання, глибоке виявлення задачі, болю, цілей, бюджету і готовності, фіксація відповідей.", "weight": 20}, {"title": "Презентація", "description": "Пропозиція під ситуацію клієнта: програма, формат супроводу, кейси, результат; без зайвого переказу всього сайту.", "weight": 20}, {"title": "Заперечення", "description": "Сумніви виявлені і закриті кейсами та фактами, без тиску.", "weight": 15}, {"title": "Закриття", "description": "Прямий перехід до рішення: завдаток/оплата або чітка домовленість.", "weight": 20}, {"title": "Наступний крок", "description": "Підсумок: хто що робить, коли, у який спосіб звʼязок.", "weight": 5}]}, "qualification": {"text": "ФОРМАТ: Квалификация клієнта (коротка розмова до 30 хв). НЕ повна діагностика.\nМета: за короткий час зрозуміти, чи клієнт — ЦА зараз, і хто винен у короткому фіналі.\n\nЕТАП 1 — КОНТАКТ (1–2 хв)\n• Привітання, представлення, перехід на «ти», рамка часу.\n\nЕТАП 2 — ВИЯВЛЕННЯ ЦІЛЬОВОСТІ (5–10 хв)\n• Чи є продукт/експертність? У якій ніші?\n• Чи були спроби запусків, досвід онлайн-продажів?\n• Фінансова готовність інвестувати в себе?\n• Готовність стартувати найближчими тижнями?\n\nЕТАП 3 — ОЗНАКИ «НЕ ЦА»\n• Клієнт хоче «через пару місяців», «ще думаю», «спочатку сам»\n• Немає продукту, немає базових знань\n• Немає бюджету, не планує вкладати\n• Хоче «щоб усе зробили за нього»\n\nЕТАП 4 — КОРЕКТНЕ ЗАВЕРШЕННЯ (2–3 хв)\n• Чесно сказати: «зараз не підходимо один одному з та const DEFAULT_AI_RULES = "- Менеджера НЕ оцінюємо за те, що він не перевірив, чи є в клієнта час на розмову: клієнта про тривалість попереджають заздалегідь. Не згадуй це ні в оцінках, ні в слабких місцях.\n- Цифри прогнозу, конверсій і доходу, які менеджер називає у фінмоделі (наприклад «60–70% заходять у роботу після міні-продукту»), — власні орієнтири команди. Це нормально; не знижуй бал за «непідтверджений прогноз». Якщо менеджер зрозуміло пояснив фінмодель (структуру доходу й орієнтири) і клієнт її прийняв, критерій про фінмодель оцінюй 80–95; нижче — лише коли фінмоделі не було або вона лишилась незрозумілою.\n- У продукті замовника НЕМАЄ групової роботи: усе — 1 на 1. Якщо в розмові йдеться про групи чи групові заняття, це формат, який клієнт пропонуватиме СВОЇМ клієнтам, а не те, що продає менеджер. Не пиши, що менеджер «запланував» чи «запропонував» груповий формат.\n- Розмова, де менеджер пройшов усі етапи структури й закрив клієнта на завдаток чи оплату, — зразкова: оцінки здебільшого 90–100, слабких місць зазвичай немає. Не шукай недоліки там, де їх нема.\n- Назви пакетів і тарифів (Швидкий старт, Silver, Big Money тощо) пиши ТІЛЬКИ якщо їх назвали в розмові. Назви зі скрипта в аналіз не переноси.\n- Рід менеджера (він чи вона) визнач за іменем з розмови й тримай один по всьому тексту; не знаєш — пиши нейтрально («менеджер провів»).\n- Якщо клієнт прямо сказав, що вирішить пізніше чи після розмови з партнером і оплати ще не було, готовність не вище 75.\n- У оцінках і слабких місцях не згадуй тривалість розмови, не пиши «за описом» чи «за скриптом» і не посилайся на ці правила. Не критикуй менеджера за затримку чи відсутність другого учасника на початку, якщо не він її спричинив.";

// Усі скрипти тримаємо в пам'яті через одну підписку (onSnapshot): сторінка «Скрипти» більше не читає базу при кожному вході,
// а нові зміни (свої й чужі) приходять самі. Підписка стартує при першому відкритті сторінки.
const scriptsStore = { map:null, unsub:null, waiters:[] };
function startScriptsSubscription(){
  if (scriptsStore.unsub) return;
  try {
    scriptsStore.unsub = db.collection("scripts").onSnapshot(sn=>{
      const m = {}; sn.forEach(d=>{ m[d.id] = d.data()||{}; });
      scriptsStore.map = m;
      const w = scriptsStore.waiters.splice(0); w.forEach(f=>f(m));
    }, err=>{
      console.warn("scripts subscribe:", err);
      try { scriptsStore.unsub && scriptsStore.unsub(); } catch(_){}
      scriptsStore.unsub = null;
      const w = scriptsStore.waiters.splice(0); w.forEach(f=>f(scriptsStore.map || {}));
    });
  } catch(ex){ console.warn(ex); }
}
function scriptsPatchLocal(id, obj){ if (scriptsStore.map) scriptsStore.map[id] = Object.assign({}, scriptsStore.map[id]||{}, obj); }
function stopScriptsSubscription(){ try { scriptsStore.unsub && scriptsStore.unsub(); } catch(_){} scriptsStore.unsub=null; scriptsStore.map=null; }
function scriptsAll(){
  if (scriptsStore.map) return Promise.resolve(scriptsStore.map);
  return new Promise(res=>{
    scriptsStore.waiters.push(res);
    startScriptsSubscription();
    setTimeout(()=>{ const i = scriptsStore.waiters.indexOf(res); if (i>=0){ scriptsStore.waiters.splice(i,1); res(scriptsStore.map||{}); } }, 8000);
  });
}
async function loadScript(packageKey){
  const m = await scriptsAll();
  return m[packageKey] ? JSON.parse(JSON.stringify(m[packageKey])) : null;
}
async function saveScript(packageKey, pkgName, data, actorUid){
  const payload = {
    name: String(pkgName || packageKey),
    text: String((data && data.text) || ""),
    aiRules: String((data && data.aiRules) != null ? data.aiRules : ""),
    ...((data && data.custom) ? { custom:true, productHint:String(data.productHint||""), short:String(data.short||"Додатковий продукт") } : {}),
    format: String((data && data.format) || "sales"),
    pkgKey: String((data && data.pkgKey) || packageKey),
    criteria: ((data && data.criteria) || []).map(c => ({
      title:       String(c && c.title       || ""),
      description: String(c && c.description || ""),
      weight:      Number(c && c.weight      || 0),
    })),
    updatedBy: actorUid || null,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  };
  try {
    await db.collection("scripts").doc(packageKey).set(payload);
    scriptsPatchLocal(packageKey, payload);
  } catch (ex) {
    console.error("saveScript set failed:", ex, "payload:", payload);
    throw ex;
  }
}

// Фото: файл (перетягни або вибери) стискається до 256px і зберігається в профілі; можна й URL
function fileToAvatar(file){
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error("Потрібна картинка (jpg, png, webp)."));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("Не вдалося прочитати файл."));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Не вдалося відкрити картинку."));
      img.onload = () => {
        const S = 256, side = Math.min(img.width, img.height);
        const cv = document.createElement("canvas"); cv.width = cv.height = S;
        cv.getContext("2d").drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, S, S);
        resolve(cv.toDataURL("image/jpeg", 0.85));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function renderSettings(root){
  const workerChip = el("span",{class:"chip chip--error"},"Перевіряю...");
  const workerInfo = el("div",{class:"muted small",style:"line-height:1.5;"},"");
  (function(){
    let d = null, loaded = false;
    function paint(){
      const beat = d && d.lastBeat && d.lastBeat.toDate ? d.lastBeat.toDate() : null;
      const ageMin = beat ? (Date.now()-beat.getTime())/60000 : null;
      if (beat && ageMin <= 2.5){
        workerChip.className = "chip chip--done"; workerChip.textContent = "Працює";
      } else {
        workerChip.className = "chip chip--error"; workerChip.textContent = beat ? "Не відповідає" : "Не підключений";
      }
      workerInfo.textContent = beat
        ? "Останній сигнал: " + beat.toLocaleString("uk-UA") + " · у черзі: " + (d.queueLength ?? "—") + (d.lastError ? " · помилка: " + d.lastError : "")
        : (loaded ? "Сигналів від сервера ще не було." : "");
    }
    try {
      const unsub = db.collection("health").doc("worker").onSnapshot(sn=>{ d = sn.exists ? sn.data() : null; loaded = true; paint(); },
        ex=>{ workerChip.textContent = "Помилка читання"; workerInfo.textContent = String(ex.code||ex.message||ex); });
      const tm = setInterval(()=>{ if (!document.body.contains(workerChip)){ clearInterval(tm); try{unsub();}catch(_){} return; } paint(); }, 15000);
    } catch(ex){ workerChip.textContent = "Помилка читання"; workerInfo.textContent = String(ex.code||ex.message||ex); }
  })();

  let limitUsd = 10;      // місячний ліміт на ІІ в доларах (settings/ai.limitUsd)
  // ---- Витрати ІІ + ліміт ----
  const costNum = el("span",{style:"font-weight:700;font-size:22px;"},"…");
  const costBar = el("span",{style:"width:0%;"});
  const costInfo = el("div",{class:"muted small",style:"margin-top:10px;line-height:1.6;"},"");
  const costWarn = el("div",{style:"margin-top:10px;font-size:13px;line-height:1.5;display:none;border-radius:10px;padding:10px 12px;"},"");
  const limitI = el("input",{type:"number",min:"0.01",step:"any",inputmode:"decimal",class:"input",style:"width:110px;text-align:center;"});
  const limitSave = el("button",{class:"btn btn-primary btn-sm"},"Зберегти ліміт");
  let usageDoc = {};
  function paintCost(){
    const an = Number(usageDoc.analysisCostUsd||0), ch = Number(usageDoc.chatCostUsd||0), spent = Math.max(an+ch, Number(usageDoc.realCostUsd||0));
    const pct = limitUsd>0 ? spent/limitUsd*100 : 0;
    costNum.textContent = "$"+spent.toFixed(2)+" з $"+limitUsd;
    costBar.style.width = Math.min(100,pct)+"%";
    costBar.style.background = pct>=100 ? "var(--danger)" : pct>=90 ? "var(--warn)" : "";
    if (pct>=100){
      costWarn.style.display = ""; costWarn.style.background = "var(--danger-soft)"; costWarn.style.color = "var(--danger)";
      costWarn.textContent = "Ліміт вичерпано — ІІ зупинено: нові аналізи й чат не працюють, розшифровка триває. Збільш ліміт, і ІІ сам продовжить.";
    } else if (pct>=90){
      costWarn.style.display = ""; costWarn.style.background = "var(--warn-soft)"; costWarn.style.color = "var(--warn)";
      costWarn.textContent = "Витрачено понад 90% ліміту. При 100% ІІ автоматично зупиниться.";
    } else costWarn.style.display = "none";
    try { paintForecast(); } catch(_){}
    costInfo.textContent = "Аналізи: $"+an.toFixed(2)+" ("+(usageDoc.analysisRequests||0)+" запитів) · Чат: $"+ch.toFixed(2)+" ("+(usageDoc.chatRequests||0)+" запитів). Цифри оновлюються самі; суму бере сервер із відповідей сервісу ІІ, тому вона збігається з рахунком. Аналіз додається до суми, коли завершується.";
  }
  const costCard = el("div",{class:"card"},
    el("div",{class:"section-title"}, el("span",{},"Витрати ІІ")),
    el("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap;"},
      el("span",{class:"muted small"},"Поточний місяць"), costNum),
    el("div",{class:"bar"}, costBar), costWarn, costInfo,
    el("div",{style:"display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;"},
      el("span",{class:"small"},"Місячний ліміт, $:"), limitI, limitSave),
    el("div",{class:"muted xs",style:"margin-top:8px;line-height:1.5;"},
      "Коли витрати на ІІ за місяць досягають ліміту, ІІ автоматично зупиняється (аналізи й чат); завантаження й розшифровка тривають. При 90% тут з'являється попередження. Якщо збільшити ліміт — ІІ сам продовжує. З початку нового місяця рахунок іде спочатку."));
  limitI.value = limitUsd;
  // живі дані: підписка на витрати поточного місяця й на налаштування
  {
    const d = new Date(); const key = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    const u1 = db.collection("usage").doc(key).onSnapshot(sn=>{ usageDoc = sn.exists ? sn.data() : {}; if (!document.body.contains(costCard)) return u1(); paintCost(); },
      ex=>{ costNum.textContent="—"; costInfo.textContent="Не вдалося прочитати: "+(ex.code||ex.message||ex); });
    const u2 = db.collection("settings").doc("ai").onSnapshot(sn=>{ if (!document.body.contains(costCard)) return u2(); const c = sn.exists ? sn.data() : {}; if (c.limitUsd){ limitUsd = Number(c.limitUsd); if (document.activeElement!==limitI) limitI.value = limitUsd; } paintCost(); }, ()=>{});
  }
  limitSave.addEventListener("click", async ()=>{
    const v = Number(limitI.value);
    if (!(v>0)){ toast("Введи ліміт більше нуля","err"); return; }
    if (v===limitUsd) return;
    const ok = await confirmModal("Змінити ліміт?", "Ліміт ІІ на місяць: $"+limitUsd+" → $"+v+"."+(v>limitUsd ? " Якщо ІІ був зупинений через ліміт, він продовжить." : ""), "Так, змінити");
    if (!ok) return;
    limitSave.disabled = true;
    try {

function quoteAtTime(transcript, t){
  if (!transcript || !transcript.length || !t) return null;
  const sec = tcToSec(t);
  // find closest line with t <= sec (last one)
  let best = transcript[0];
  for (const line of transcript){
    if (tcToSec(line.t) <= sec) best = line; else break;
  }
  return best;
}
function postToYT(iframe, func, args){
  try { iframe.contentWindow.postMessage(JSON.stringify({event:"command",func:func,args:args||[]}), "*"); } catch(e){}
}
function tcToSec(t){
  const parts = String(t||"").split(":").map(Number);
  if (parts.length === 3) return (parts[0]||0)*3600 + (parts[1]||0)*60 + (parts[2]||0);
  if (parts.length === 2) return (parts[0]||0)*60 + (parts[1]||0);
  return 0;
}

  // === Загрузка реальной расшифровки и анализа из Firestore ===
  function parseChunkText(txt){

  // Таймкоди [mm:ss] і діапазони [mm:ss–mm:ss] у тексті → кнопки (клік → рядок у транскрипті)
  function tcLinks(str){
    str = String(str==null ? "" : str);
    const out = []; const re = /\[(\d{1,2}:\d{2}(?::\d{2})?)(?:\s*[–—-]\s*(\d{1,2}:\d{2}(?::\d{2})?))?\]/g; let last = 0, m;

  const emptyCard = (title, msg) => el("div",{class:"cv-card"}, el("div",{class:"cv-card__title"}, title), el("div",{class:"muted small"}, msg || "Поки немає даних"));

    if (t==="weak"){

          return el("div",{class:"cv-card "+(w.severity==="critical"?"cv-card--crit":"cv-card--warn"), id: w.id?("cv-weak-"+w.id):undefined},

      return el("div",{class:"cv-card"},

          el("div",{style:"display:flex;gap:8px;"},
            el("button",{class:"btn-icon btn-ghost", title:"Скопіювати в буфер", onclick:()=>{
              navigator.clipboard.writeText(plain).then(

            }}, ICONS.copy()),
            el("button",{class:"btn-icon btn-primary", title:"Завантажити .txt", onclick:()=>{
              const blob = new Blob([plain], {type:"text/plain;charset=utf-8"});

              const a = document.createElement("a");
              a.href = url; a.download = "transcript-"+call.id+".txt";
              document.body.appendChild(a); a.click();

            }}, ICONS.download())
          )),

      );

    if (t==="script" && (d.criteria||[]).length){
      return el("div",{class:"cv-card"},
        el("div",{class:"cv-card__title"},"Виконання скрипта по критеріях"),
        el("div",{class:"muted small",style:"margin:2px 0 6px;"},"Натисни на критерій, щоб побачити, чому така оцінка"),
        d.criteria.map(c => {
          const col = c.na ? "var(--text-muted)" : (c.score>=80?"var(--success)":c.score>=60?"var(--warn)":"var(--danger)");
          const rel = (d.weaknesses||[]).filter(w => w.criterion===c.name);
          const row = el("div",{class:"crit"+(callDetailState.openCrit===c.name?" is-open":""), "data-crit":c.name},
            el("div",{class:"crit__head", onclick:()=>{
              const open = row.classList.toggle("is-open");
              callDetailState.openCrit = open ? c.name : null;
            }},
              el("div",{class:"crit__top"},
                el("span",{style:"font-weight:500;font-size:13.5px;"}, el("span",{class:"crit__chev"},"▶"), c.name + (c.weight ? " · складає "+c.weight+"%" : "")),
                el("span",{style:"font-weight:700;color:"+col+";"}, c.na ? "не оцінюється" : c.score+"%")),
              el("div",{class:"bar"}, el("span",{style:"width:"+(c.na?0:c.score)+"%;background:"+col+";"}))),
            el("div",{class:"crit__wrap"}, el("div",{},
              el("div",{class:"crit__body"},
                el("div",{class:"crit__why"}, ...(c.comment ? tcLinks(c.comment) : ["Пояснення поки немає."])),
                rel.length ? rel.map(w => {
                  const q = w.times && w.times[0] ? quoteAtTime(d.transcript, w.times[0]) : null;
                  return el("div",{class:"crit__rel"},
                    el("div",{style:"font-weight:600;font-size:13px;margin-bottom:2px;"}, w.title),
                    w.body ? el("div",{class:"muted small"}, ...tcLinks(w.body)) : null,
                    q ? el("div",{class:"cv-quote",style:"margin-top:6px;",onclick:()=>jumpToTranscript(w.times[0])},
                      el("span",{class:"cv-quote__time"}, w.times[0]),
                      el("span",{}, "«"+q.text+"»")) : null);
                }) : el("div",{class:"muted small",style:"margin-top:8px;"},"Окремих зауважень за цим критерієм немає."))))
          );
          return row;
        }));
    }
    if (t==="script"){
      return el("div",{class:"cv-card"},
        el("div",{class:"cv-card__title"},"Скрипт менеджера"),
        el("div",{class:"muted small", style:"margin-top:4px;"},
          "Скрипти редагуються в розділі «Скрипти». Тут буде показана версія скрипта, що діяла на момент аналізу розмови (scriptVersion = " +
          (call.scriptVersion || "—") + ")."));
    }
    if (t==="client"){
      function painItem(x){
        const q = quoteAtTime(d.transcript, x.t);
        return el("div",{style:"padding:10px 0;border-bottom:1px solid rgba(0,0,0,.05);"},
          el("div",{style:"display:flex;justify-content:space-between;align-items:center;"},
            el("span",{style:"font-size:13.5px;font-weight:500;"}, x.text),
            el("button",{class:"tc", onclick:()=>jumpToTranscript(x.t)}, x.t)),
          q ? el("div",{class:"cv-quote", style:"margin-top:6px;", onclick:()=>jumpToTranscript(x.t)},
            el("span",{class:"cv-quote__role"}, q.r),
            el("span",{}, "«" + q.line_or_text(q) + "»")) : null
        );
      }
      // helper not available inline — simplified
      function withQuote(x){
        const q = quoteAtTime(d.transcript, x.t);
        return el("div",{style:"padding:10px 0;"},
          el("div",{style:"display:flex;justify-content:space-between;align-items:center;gap:10px;"},
            el("span",{style:"font-size:13.5px;font-weight:500;"}, x.text + (x.handled?" ✓":"")),
            el("button",{class:"tc", onclick:(e)=>{ e.stopPropagation(); jumpToTranscript(x.t); }}, x.t)),
          q ? el("div",{class:"cv-quote", style:"margin-top:6px;", onclick:()=>jumpToTranscript(x.t)},
            el("span",{class:"cv-quote__role"}, q.r),
            el("span",{}, "«" + q.text + "»")) : null
        );
      }
      return el("div",{},
        el("div",{class:"cv-card"}, el("div",{class:"cv-card__title"},"Профіль клієнта"),
          d.client.profile ? el("div",{class:"cv-card__body"}, d.client.profile) : el("div",{class:"muted small"},"Поки немає даних"),
          d.client.readiness!=null ? el("div",{style:"margin-top:12px;"},
            el("div",{class:"muted small",style:"margin-bottom:4px;"},"Готовність до покупки: "+d.client.readiness+"%"),
            el("div",{class:"bar"}, el("span",{style:"width:"+d.client.readiness+"%;"}))) : null),
        el("div",{class:"cv-card cv-card--pain"}, el("div",{class:"cv-card__title"},"Болі клієнта"),
          d.pains.length ? d.pains.map(withQuote) : el("div",{class:"muted small"},"Поки немає даних")),
        el("div",{class:"cv-card cv-card--obj"}, el("div",{class:"cv-card__title"},"Заперечення"),
          d.objections.length ? d.objections.map(withQuote) : el("div",{class:"muted small"},"Поки немає даних"))
      );
    }
  }

  const content = el("div",{}, renderTab());
  const tabsBar = el("div",{class:"cv-tabs"},
    TABS.map(t => el("button",{class:t.key===callDetailState.tab?"is-active":"",
      onclick: ()=>{
        callDetailState.tab=t.key;
        content.replaceChildren(renderTab());
        refreshTabs();
        const pane = content.closest(".cv-pane-left");
        if (pane) pane.scrollTop = 0;
      } }, t.label)));
  function refreshTabs(){ Array.from(tabsBar.children).forEach((b,i)=>{ b.className = TABS[i].key===callDetailState.tab?"is-active":""; }); }

  // Chat
  const chatList = el("div",{class:"cv-chat__list"});
  // Таймкоди [mm:ss] у відповідях ІІ стають кнопками: клік → рядок у транскрипті
  function chatNodes(text){
    // **жирний** → <strong>; таймкоди [mm:ss] → кнопки
    const tcNodes = (str) => {
      const out = []; const re = /\[(\d{1,2}:\d{2}(?::\d{2})?)\]/g; let last = 0, m;
      while ((m = re.exec(str))){
        if (m.index > last) out.push(str.slice(last, m.index));
        const tt = m[1];
        out.push(el("button",{class:"tc", type:"button", title:"Відкрити в транскрипті", onclick:()=>jumpToTranscript(tt)}, tt));
        last = m.index + m[0].length;
      }
      if (last < str.length) out.push(str.slice(last));
      return out;
    };
    const out = []; const bre = /\*\*([\s\S]+?)\*\*/g; let last = 0, b;
    while ((b = bre.exec(text))){
      if (b.index > last) out.push(...tcNodes(text.slice(last, b.index)));
      out.push(el("strong",{}, ...tcNodes(b[1])));
      last = b.index + b[0].length;
    }
    if (last < text.length) out.push(...tcNodes(text.slice(last)));
    return out;
  }
  let chatWaitTimer = null;
  let chatBtn = null;
  const chatStopped = new Set();   // id питань, які користувач зупинив (кнопка «Стоп»)
  // «Зупинено» береться і з бази (команда stop у чаті), тому не зникає після оновлення сторінки
  function isStopped(id){ return !!id && (chatStopped.has(id) || chatMsgs.some(m => m.cmd==='stop' && m.target===id)); }
  // Яке питання зараз «в роботі»: останнє питання без готової відповіді або відповідь, що ще пишеться
  function chatState(){
    const vis = chatMsgs.filter(m => !m.cmd);
    const last = vis[vis.length-1];
    if (!last) return { busy:false };
    if (last.role==="user") return { busy: !isStopped(last.id), targetId: last.id, last };
    if (last.status==="pending" || last.status==="streaming") return { busy: !isStopped(last.replyTo), targetId: last.replyTo, last };
    return { busy:false };
  }
  async function stopChat(targetId){
    if (!targetId) return;
    chatStopped.add(targetId); paintChat();
    try {
      await chatRef.add({ role:"user", cmd:"stop", target:targetId, text:"", status:"done",
        uid:(activeUser && activeUser.uid) || null, authorEmail:(activeUser && activeUser.email) || null,
        ts: firebase.firestore.FieldValue.serverTimestamp() });
    } catch(ex){ console.warn("chat stop:", ex); }
  }
  function paintChat(){
    chatList.replaceChildren();
    const vis = chatMsgs.filter(m => !m.cmd);
    vis.forEach(m => {
      if (m.role==="user"){ chatList.appendChild(el("div",{class:"cv-chat__msg is-user"}, m.text||"")); return; }
      const live = (m.status==="pending" || m.status==="streaming");
      const stopped = m.status==="stopped" || (live && isStopped(m.replyTo));
      if (stopped){
        chatList.appendChild(el("div",{class:"cv-chat__msg is-ai is-stopped"},
          m.text ? chatNodes(m.text) : null, el("div",{class:"cv-chat__stopnote"}, "Зупинено")));
      } else if (m.status==="pending"){
        chatList.appendChild(el("div",{class:"cv-chat__msg is-ai is-pending"}, "ІІ думає…"));
      } else if (m.status==="streaming"){
        chatList.appendChild(el("div",{class:"cv-chat__msg is-ai is-streaming"}, chatNodes(m.text||"")));
      } else {
        chatList.appendChild(el("div",{class:"cv-chat__msg is-ai"+(m.status==="error"?" is-err":"")}, chatNodes(m.text||"")));
      }
    });
    const last = vis[vis.length-1];
    if (chatWaitTimer){ clearTimeout(chatWaitTimer); chatWaitTimer = null; }
    if (last && last.role==="user"){
      if (isStopped(last.id)){
        chatList.appendChild(el("div",{class:"cv-chat__msg is-ai is-stopped"}, el("div",{class:"cv-chat__stopnote"}, "Зупинено")));
      } else {
        let ms = null; try { ms = last.ts && last.ts.toMillis ? last.ts.toMillis() : null; } catch(_){}
        const waited = ms ? Date.now()-ms : 0;
        if (waited > 90000){
          chatList.appendChild(el("div",{class:"cv-chat__msg is-ai is-err"}, "Поки що чекаю ключ ІІ. Якщо ключ уже додано, перезапусти сервер."));
        } else {
          chatList.appendChild(el("div",{class:"cv-chat__msg is-ai is-pending"}, "ІІ думає…"));
          chatWaitTimer = setTimeout(paintChat, Math.max(1000, 91000-waited));
        }
      }
    }
    if (chatBtn){
      const st = chatState();
      chatBtn.className = st.busy ? "is-stop" : "";
      chatBtn.textContent = st.busy ? "■" : "→";
      chatBtn.title = st.busy ? "Зупинити відповідь" : "Надіслати";
      chatBtn.type = st.busy ? "button" : "submit";
    }
    requestAnimationFrame(()=>{ chatList.scrollTop = chatList.scrollHeight; });
  }
  async function sendMsg(text){
    if (!text || !text.trim()) return;
    if (!aiAllowed()){ toast("Доступ до ІІ-чату закрито адміністратором","err"); return; }
    const _cur = callsAll().find(c => c.id===callId);
    if (!(_cur && (_cur.transcriptReady || _cur.status==="done"))){ toast("Чат доступний після транскрибації розмови","err"); return; }
    const msg = {
      role: "user",
      text: text.trim(),
      uid: (activeUser && activeUser.uid) || null,
      authorEmail: (activeUser && activeUser.email) || null,
      ts: firebase.firestore.FieldValue.serverTimestamp(),
      status: "done",
    };
    try {
      await chatRef.add(msg);
      logAction("chat_question", _cur, text.trim().slice(0,80));
    } catch (ex) {
      console.error("chat write:", ex);
      alert("Не вдалося зберегти повідомлення: " + (ex.code||ex.message));
      return;
    }
  }
  const chatInput = el("input",{type:"text",placeholder:aiAllowed() ? "Запитай ІІ про цю розмову…" : "Доступ до ІІ-чату закрито адміністратором",maxlength:"2000"});
  if (!aiAllowed()) chatInput.disabled = true;
  const chatForm = el("form",{class:"cv-chat__form", onsubmit:(e)=>{ e.preventDefault(); const v = chatInput.value; if (!v.trim()) return; chatInput.value=""; sendMsg(v); }},
    chatInput, (chatBtn = el("button",{type:"submit", title:"Надіслати",
      onclick:(e)=>{ const st = chatState(); if (st.busy){ e.preventDefault(); stopChat(st.targetId); } }},"→")));
  const chatQuick = el("div",{class:"cv-chat__quick"},
    MOCK_CHAT_SUGGESTIONS.map(q => el("button",{type:"button", onclick:()=>sendMsg(q)}, q)));
  const chat = el("div",{class:"cv-chat"},
    el("div",{class:"cv-chat__head"}, "ІІ-чат"),
    chatList, chatForm);
  paintChat();

  // Splitter — resize player vs chat; persisted per user
  const prefKey = "alexa_cv_player_h_" + ((activeUser && activeUser.email) || "anon");
  const savedH = parseInt(localStorage.getItem(prefKey) || "0", 10);
  function applyPlayerHeight(h){
    if (!h || h < 120) return;
    playerNode.classList.add("is-fixed");
    playerNode.style.height = h + "px";
  }
  if (savedH > 120) applyPlayerHeight(savedH);
  const splitter = el("div",{class:"cv-splitter", title:"Перетягни щоб змінити розмір"});
  splitter.addEventListener("mousedown",(e)=>{
    e.preventDefault();
    document.body.classList.add("is-row-resizing");
    splitter.classList.add("is-drag");
    const shield = el("div",{class:"drag-shield"});
    document.body.appendChild(shield);
    const rect = playerNode.getBoundingClientRect();
    const startY = e.clientY, startH = rect.height;
    const paneRight = splitter.parentElement;
    const paneRect = paneRight.getBoundingClientRect();
    const minPlayer = 120;
    const minChat   = 120;
    const onMove = (ev)=>{
      const dy = ev.clientY - startY;
      const maxH = paneRect.height - minChat - 40;
      const h = Math.max(minPlayer, Math.min(maxH, startH + dy));
      applyPlayerHeight(h);
    };
    const onUp = ()=>{
      shield.removeEventListener("mousemove", onMove);
      shield.removeEventListener("mouseup", onUp);
      document.removeEventListener("mouseup", onUp);
      shield.remove();
      document.body.classList.remove("is-row-resizing");
      splitter.classList.remove("is-drag");
      try { localStorage.setItem(prefKey, String(Math.round(playerNode.getBoundingClientRect().height))); } catch(_){}
    };
    shield.addEventListener("mousemove", onMove);
    shield.addEventListener("mouseup", onUp);
    document.addEventListener("mouseup", onUp); // safety if cursor leaves window
  });

  const pKind = (playerNode.className.includes("cv-player__video") ? "iframe" : "ph") + ":" + (d.youtubeId||"");
  const existingGrid = root.querySelector(".cv-grid");
  if (existingGrid && root.dataset.callId===callId && root.dataset.playerKind===pKind){
    // той самий відео-стан: оновлюємо лише ліву колонку, плеєр і чат не перемальовуємо
    const left = existingGrid.querySelector(".cv-pane-left"), top = left.scrollTop;
    left.replaceChildren(tabsBar, content);
    left.scrollTop = top;
    return;
  }
  root.dataset.callId = callId; root.dataset.playerKind = pKind;
  root.replaceChildren(
    el("div",{class:"cv-grid"},
      el("div",{class:"cv-pane-left"}, tabsBar, content),
      el("div",{class:"cv-pane-right"},
        el("div",{class:"cv-player",style:"flex-shrink:0;"}, playerNode),
        splitter,
        chat)
    )
  );
  // reset scroll of left pane after render
  const paneL = root.querySelector(".cv-pane-left");
  if (paneL) paneL.scrollTop = 0;
}

async function openAddCallFullscreen(){
  const actor = activeUser;
  let managers = [];
  try { managers = (await listUsers()).filter(u => u.role===ROLES.MANAGER); } catch(ex){ console.warn(ex); }
  // якщо актор - менеджер, він тільки за себе
  const canSelectMgr = actor.role!==ROLES.MANAGER;
  // По замовчуванню менеджер не вибраний — щоб не додати випадково не тому.
  const defaultMgrEmail = canSelectMgr ? null : actor.email;

  let ov = document.getElementById("cv-overlay"); if (ov) ov.remove();
  ov = document.createElement("div"); ov.id = "cv-overlay"; ov.className = "cv-overlay";
  ov.style.alignItems = "center"; ov.style.padding = "24px";
  ov.addEventListener("click", (e) => { if (e.target===ov) location.hash = "#/calls"; });
  const modal = document.createElement("div"); modal.className = "cv-modal cv-modal--sm";

  const state = { mgr: defaultMgrEmail, url:"", client:"", title:"" };

  const err = el("div",{class:"login-err"});
  const urlHint = el("div",{class:"muted xs",style:"margin-top:4px;height:16px;"},"");
  async function tryAutofill(url){
    const vid = extractVideoId(url);
    if (!vid){ urlHint.textContent=""; state._ytName=""; return; }
    urlHint.textContent = "Беремо назву з YouTube…";
    try {
      const r = await fetch("https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v="+vid+"&format=json");
      if (!r.ok) throw new Error("yt oembed "+r.status);
      const d = await r.json();
      const name = (d.title||"").trim();
      if (name){
        state._ytName = name;
        urlHint.textContent = "Назва з YouTube: " + name;
      } else { state._ytName=""; urlHint.textContent = "YouTube не повернув назву (підставимо videoId)."; }
    } catch(ex){
      state._ytName="";
      urlHint.textContent = "Не вдалося взяти назву (приватне відео або немає інтернету) — підставимо videoId.";
    }
  }
  let _tFill = null;
  const urlI = el("input",{type:"url", class:"input", placeholder:"https://www.youtube.com/watch?v=…", oninput:(e)=>{
    state.url=e.target.value;
    clearTimeout(_tFill);
    _tFill = setTimeout(()=>tryAutofill(state.url), 500);
  }});

  let mgrPicker;
  if (canSelectMgr){
    const opts = managers.map(m => ({ value:m.email, label:m.name||m.email, name:m.name, email:m.email, photoURL:m.photoURL||null }));
    mgrPicker = dropdown({
      value: state.mgr, options: opts, placeholder: "Виберіть менеджера",
      onChange: v => { state.mgr = v; },
      renderButton: o => el("span",{class:"dd__btn-left"}, userAva(o,"sm"), el("span",{class:"dd__btn-label"}, o.label)),
      renderItem:   o => el("div",{style:"display:flex;align-items:center;gap:10px;flex:1;"}, userAva(o,"sm"), el("span",{}, o.label)),
    });
  }

  function extractVideoId(u){
    try {
      const m = String(u).match(/[?&]v=([A-Za-z0-9_-]{11})|youtu\.be\/([A-Za-z0-9_-]{11})|\/embed\/([A-Za-z0-9_-]{11})|\/live\/([A-Za-z0-9_-]{11})/);
      if (m) return m[1]||m[2]||m[3]||m[4];
    } catch(_){}
    return null;
  }

  const submit = el("button",{class:"btn btn-primary", onclick: async (e)=>{
    err.textContent = "";
    const url = (state.url||"").trim();
    // client removed — беремо назву з YouTube
    const mgr = state.mgr;
    if (!mgr){ err.textContent = "Виберіть менеджера."; return; }
    if (!url){ err.textContent = "Заповни YouTube URL."; return; }
    const videoId = extractVideoId(url);
    if (!videoId){ err.textContent = "Невалідний YouTube URL."; return; }
    let finalClient = (state._ytName||"").trim();
    if (!finalClient){
      try {
        const r = await fetch("https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v="+videoId+"&format=json");
        if (r.ok){ const d = await r.json(); finalClient = (d.title||"").trim(); }
      } catch(_){}
    }
    if (!finalClient) finalClient = "YouTube-ефір "+videoId;
    e.target.disabled = true; e.target.textContent = "Додаємо...";
    try {
      await db.collection("calls").add({
        managerEmail: mgr,
        managerUid: (actor.email === mgr ? actor.uid : null),
        client: finalClient,
        title: finalClient,
        videoUrl: url,
        videoId: videoId,
        channelId: null,
        channelTitle: null,
        startedAt: new Date().toISOString(),
        endedAt: null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        createdBy: actor.uid,
        createdByEmail: actor.email,
        source: "manual",
        status: "queued",
        stage: "waiting_worker",
        durationSec: 0,
        score: null,
        summaryShort: "",
        audioReady: false,
        transcriptReady: false,
        costEur: 0,
        scriptVersion: null,
        error: null,
      });
      toast("Додано у чергу", "ok");
      location.hash = "#/calls";
    } catch(ex){
      err.textContent = ex.code || ex.message || String(ex);
      e.target.disabled = false; e.target.textContent = "Додати в чергу";
    }
  }}, "Додати в чергу");

  const header = el("div",{class:"cv-modal__header"},
    el("div",{style:"flex:1;min-width:0;"},
      el("h2",{class:"cv-modal__title"},"Додати розмову"),
      el("div",{class:"cv-modal__sub"},"Запис буде поставлений у чергу. Сервер підхопить і обробить автоматично.")),
    el("button",{class:"cv-modal__close", title:"Закрити", onclick:()=>{ location.hash = "#/calls"; }}, ICONS.x())
  );
  modal.appendChild(header);

  const body = document.createElement("div"); body.className = "cv-modal__body cv-modal__body--plain";
  const inner = el("div",{class:"cv-form"},
    canSelectMgr ? el("div",{class:"cv-field"}, el("label",{},"Менеджер"), mgrPicker)
                 : el("div",{class:"muted small",style:"margin-bottom:4px;"}, "Розмова додається тобі — " + actor.email),
    el("div",{class:"cv-field"}, el("label",{},"YouTube URL *"), urlI, urlHint),
    el("div",{class:"cv-hint"},"Посилання на запис YouTube ефіру. Сервер скачає аудіо, зробить розшифровку й аналіз."),

    err,
    el("div",{class:"cv-form__actions"},
      el("button",{class:"btn btn-ghost", onclick:()=>{ location.hash = "#/calls"; }},"Скасувати"),
      submit)
  );
  body.appendChild(inner);
  modal.appendChild(body);

  ov.appendChild(modal);
  document.body.appendChild(ov);
  document.body.style.overflow = "hidden";
  if (!window.__cvEsc){
    window.__cvEsc = (e)=>{ if (e.key==="Escape" && document.getElementById("cv-overlay")) location.hash = "#/calls"; };
    document.addEventListener("keydown", window.__cvEsc);
  }
}

function closeFullscreen(){
  if (window.__cvChatUnsub){ try { window.__cvChatUnsub(); } catch(_){} window.__cvChatUnsub = null; }
  const ov = document.getElementById("cv-overlay");
  if (ov) ov.remove();
  document.body.style.overflow = "";
}
function openCallFullscreen(callId, soft){
  if (!soft && !(document.getElementById("cv-overlay") && document.getElementById("cv-overlay").dataset.callId===callId)) callDetailState.openCrit = null;
  const call = callsAll().find(c => c.id===callId);
  // прямая ссылка / F5: данных ещё нет — ждём первую загрузку calls и открываем заново
  if (!call && !window.__callsLoaded){
    window.addEventListener(CALLS_CHANGED_EVT, () => openCallFullscreen(callId), { once:true });
    return;
  }
  // шапка/кнопки зависят от статуса: перерисовать карточку, когда статус изменился (мной или сервером)
  window.__cvStatus = call ? call.status : null;
  if (window.__cvLive) window.removeEventListener(CALLS_CHANGED_EVT, window.__cvLive);
  window.__cvLive = () => {
    if (!document.getElementById("cv-overlay")) { window.removeEventListener(CALLS_CHANGED_EVT, window.__cvLive); return; }
    const cur = callsAll().find(c => c.id===callId);
    if (cur && cur.status !== window.__cvStatus) openCallFullscreen(callId, true);
    else if (cur) cvProgressUpdate(cur);
  };
  window.addEventListener(CALLS_CHANGED_EVT, window.__cvLive);
  const mgr  = call ? userByEmail(call.managerEmail) : null;

  // Keep navbar/shell behind — modal just overlays with backdrop
  let ov = document.getElementById("cv-overlay");
  const prevOv = (soft && ov && ov.dataset.callId===callId) ? ov : null;   // м'яке оновлення: плеєр/чат не чіпаємо
  if (ov && !prevOv) ov.remove();

  ov = document.createElement("div");
  ov.id = "cv-overlay"; ov.className = "cv-overlay"; ov.dataset.callId = callId;
  // click on backdrop closes
  ov.addEventListener("click", (e) => { if (e.target===ov) location.hash = "#/calls"; });

  const modal = document.createElement("div"); modal.className = "cv-modal";

  // Header
  // "queued" теж — звонок може висіти з transcriptReady=true від старого stub.
  const canRestart = call && aiAllowed() && ["skipped_short","error","canceled","idle","transcribed","done"].includes(call.status);
  const restartBtn = canRestart ? el("button",{class:"btn btn-primary btn-sm", style:"margin-right:8px;",
    onclick: async (e)=>{
      const btn = e.currentTarget; btn.disabled = true;
      try {
        const ok = await startCallAnalysis(call);
        if (ok) toast("Відправлено в чергу — сервер підхопить", "ok"); else btn.disabled = false;
      } catch(ex){
        toast(ex.code||ex.message||String(ex), "err"); btn.disabled = false;
      }
    } }, call.status==="done" ? "Перезапустити аналіз" : (call.transcriptReady ? "Зробити аналіз" : "Почати аналіз")) : null;

  const canCancel = call && ["queued","queued_for_analysis","ended","downloading","transcribing","analyzing"].includes(call.status);
  const cancelBtn = canCancel ? el("button",{class:"btn btn-ghost btn-sm", style:"margin-right:8px;",
    onclick: async (e)=>{
      e.target.disabled = true; e.target.textContent = "Скасовую...";
      try {
        await cancelCall(call);
        toast("Скасовано", "ok");
      } catch(ex){
        toast(ex.code||ex.message||String(ex), "err");
        e.target.disabled = false; e.target.textContent = "Скасувати";
      }
    } }, (call.status==="downloading"||call.status==="transcribing"||call.status==="analyzing") ? "Скасувати" : "Прибрати з черги") : null;

  const header = el("div",{class:"cv-modal__header"},
    el("div",{style:"flex:1;min-width:0;"},
      el("div",{style:"display:flex;align-items:center;gap:10px;flex-wrap:wrap;"},
        el("h2",{class:"cv-modal__title"}, call ? ((call.source==="youtube_watcher" ? "YouTube ефір · " : "Картка розмови · ") + (call.client || call.title || call.videoId || "")) : "Розмова"),
        call ? statusBadge(call.status) : null,
        call && call.status==="skipped_short" ? el("span",{class:"muted small"}, "< 30 хв — автоматично не обробляється") : null),
      call ? el("div",{class:"cv-modal__sub"},
        (mgr.name||mgr.email) + " · " + fmtDate(call.startedAt) + " о " + fmtTime(call.startedAt) + (call.durationSec?" · "+fmtTimeRange(call.startedAt, call.durationSec, call.status):""))
        : null
    ),
    (call && call.videoId) ? el("a",{href:"https://www.youtube.com/watch?v="+call.videoId, target:"_blank", rel:"noopener",
      class:"btn btn-ghost btn-sm", style:"margin-right:8px;text-decoration:none;"}, "Відкрити на YouTube ↗") : null,
    cancelBtn,
    restartBtn,
    el("button",{class:"cv-modal__close", title:"Закрити", onclick:()=>{ location.hash = "#/calls"; }}, ICONS.x())
  );
  modal.appendChild(header);
  if (call && PROC_STATES.includes(call.status)) modal.appendChild(cvProgressNode(call));
  if (prevOv){
    // замінюємо лише шапку, смугу прогресу і ліву колонку; відео та чат лишаються як були
    window.__cvStatus = call ? call.status : null;
    prevOv.querySelector(".cv-modal__header").replaceWith(header);
    const oldStrip = prevOv.querySelector("[data-cv-pb]"), newStrip = modal.querySelector("[data-cv-pb]");
    if (oldStrip && newStrip) oldStrip.replaceWith(newStrip); else if (oldStrip) oldStrip.remove(); else if (newStrip) header.after(newStrip);
    try { renderCallDetail(prevOv.querySelector(".cv-modal__body"), callId); } catch(e){ console.warn(e); }
    return;
  }

  const body = document.createElement("div"); body.className = "cv-modal__body";
  modal.appendChild(body);

  ov.appendChild(modal);
  document.body.appendChild(ov);
  document.body.style.overflow = "hidden";

  if (!window.__cvEsc){
    window.__cvEsc = (e)=>{ if (e.key==="Escape" && document.getElementById("cv-overlay")) location.hash = "#/calls"; };
    document.addEventListener("keydown", window.__cvEsc);
  }
  try { renderCallDetail(body, callId); }
  catch(e){ console.error(e); body.replaceChildren(el("div",{class:"card"},"Помилка: "+(e.message||e))); }
}
/* ========================================================
 *  Shell + router
 * ======================================================== */
let activeUser = null;
const ROUTES = {
  "#/overview": renderOverview,
  "#/calls":    renderCalls,
  "#/progress": renderProgress,
  "#/scripts":  renderScripts,
  "#/users":    renderUsers,
  "#/settings": renderSettings,
};
function parseHash(){
  const h = (location.hash||"#/overview").replace(/^#\//, "");
  const parts = h.split("/");
  return { route: parts[0] || "overview", arg: parts[1] || null };
}
function activeKey(){ return parseHash().route; }
function ensureRoot(){
  let r=document.getElementById("app");
  if (!r){ r=document.createElement("div"); r.id="app"; document.body.appendChild(r); }
  return r;
}
function render(){
  try { window.__lastListSig = parseHash().route+"|"+callsSig(); } catch(_){ window.__lastListSig = null; }
  if (!activeUser){ closeFullscreen(); renderLogin(ensureRoot()); return; }
  if (activeUser.status==="disabled"){
    document.querySelectorAll("nav.navbar").forEach(n=>n.remove());
    ensureRoot().replaceChildren(el("div",{class:"login-wrap"},
      el("div",{class:"card login-card",style:"text-align:center;"},
        el("h2",{style:"margin:0 0 10px;color:var(--danger);"},"Доступ вимкнено"),
        el("div",{style:"color:var(--text-muted);margin-bottom:16px;"},"Твій акаунт вимкнений адміністратором."),
        el("button",{class:"btn btn-ghost",onclick:()=>auth.signOut()},"Вийти"))));
    return;
  }
  const { route, arg } = parseHash();
  // Fullscreen branch: do NOT build navbar/shell
  if (route==="calls" && arg){
    const allowed0 = new Set(MENU_BY_ROLE[activeUser.role]||[]);
    if (allowed0.has("calls")){
      if (arg==="new"){ openAddCallFullscreen(); return; }
      openCallFullscreen(arg); return;
    }
  }
  // Normal: ensure overlay is closed, build navbar/shell
  closeFullscreen();
  document.querySelectorAll("nav.navbar").forEach(n=>n.remove());
  document.body.prepend(navbar(activeUser, route));
  let shell=document.getElementById("app");
  if (!shell || !shell.classList.contains("app-shell")){
    if (shell) shell.remove();
    shell=document.createElement("div"); shell.id="app"; shell.className="app-shell";
    document.body.appendChild(shell);
  }
  // Deep-link: #/calls/<id> → fullscreen overlay (before touching shell)
  if (route==="calls" && arg){
    const allowedD = new Set(MENU_BY_ROLE[activeUser.role]||[]);
    if (allowedD.has("calls")){ openCallFullscreen(arg); return; }
  }
  // We're on a normal route — tear down any overlay
  closeFullscreen();
  const allowed = new Set(MENU_BY_ROLE[activeUser.role]||[]);
  if (!allowed.has(route)){
    shell.replaceChildren(el("h1",{class:"page-title"},"Немає доступу"),
      el("div",{class:"card"},"Для твоєї ролі цей розділ недоступний."));
    return;
  }
  const fn = ROUTES["#/"+route] || renderOverview;
  // кожен розділ малюється у власний контейнер: повільний (async) розділ, від якого вже пішли, не перезапише поточний
  const view = document.createElement("div");
  shell.replaceChildren(view);
  Promise.resolve(fn(view)).catch(err=>{
    console.error(err);
    view.replaceChildren(el("div",{class:"card"},"Помилка: "+(err.message||err)));
  });
}
window.addEventListener("hashchange", render);
window.addEventListener(CALLS_CHANGED_EVT, ()=>{
  if (!activeUser) return;
  const { route, arg } = parseHash();
  // Re-render just the content area for live updates without re-mounting navbar/overlay
  if (route==="calls" && arg){
    const ov = document.getElementById("cv-overlay");
    if (ov){
      // re-render only the detail body (keep modal shell)
      const body = ov.querySelector(".cv-modal__body");
      // перемальовувати лише якщо змінились суттєві поля цієї розмови (інакше відео в плеєрі перезавантажується
      // від кожного оновлення прогресу / інших розмов)
      const cur = callsAll().find(c => c.id===arg);
      const sig = cur ? JSON.stringify([cur.status, cur.embeddable, cur.title, cur.client, cur.audioReady, cur.transcriptReady, cur.score, cur.summaryShort, cur.error, cur.videoId, cur.durationSec]) : "";
      if (body && body.dataset.sig === undefined){ body.dataset.sig = sig; }
      else if (body && body.dataset.sig !== sig){
        body.dataset.sig = sig;
        try { renderCallDetail(body, arg); } catch(e){ console.warn(e); }
      }
    }
    return;
  }
  if (["overview","calls","progress"].includes(route)){
    const sg = callsSig(); const key = route+"|"+sg;
    if (window.__lastListSig === key) return;   // нічого видимого не змінилось — не перемальовуємо
    window.__lastListSig = key;
    const shell = document.getElementById("app");
    if (!shell) return;
    const fn = ROUTES["#/"+route];
    if (fn) { try { fn(shell); } catch(e){ console.warn(e); } }
  }
});
window.__refreshAfterProfile = async () => {
  try { activeUser = await getCurrentUser(); await refreshUserCache(true); render(); } catch(ex){ console.error(ex); }
};
auth.onAuthStateChanged(async (u)=>{
  document.querySelectorAll("nav.navbar").forEach(n=>n.remove());
  const fresh=document.createElement("div"); fresh.id="app";
  const old=document.getElementById("app"); if (old) old.replaceWith(fresh); else document.body.appendChild(fresh);
  if (!u){ activeUser=null; stopCallsSubscription(); stopScriptsSubscription(); renderLogin(fresh); return; }
  try { activeUser = await getCurrentUser(); await refreshUserCache(); startCallsSubscription(activeUser); }
  catch(ex){
    fresh.replaceChildren(el("div",{class:"card login-card",style:"margin:40px auto;background:var(--danger-soft);border-color:var(--danger);"},
      el("div",{style:"font-weight:600;color:var(--danger);"},"Не вдалося прочитати users/{email}"),
      el("div",{style:"margin-top:6px;color:var(--text-muted);font-size:13px;"}, String(ex.code||ex.message||ex)),
      el("div",{style:"margin-top:10px;"}, el("button",{class:"btn btn-ghost",onclick:()=>auth.signOut()},"Вийти"))));
    return;
  }
  render();
});
</script>
