<!doctype html>
<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<title>Aleksa · Контроль якості</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
:root[data-theme="light"]{
  --bg:#F3F5FB; --surface:#fff; --surface-2:#F7F9FD; --border:#E5E8F0; --border-strong:#D4D9E4;
  --text:#151A2E; --text-muted:#6B7390; --text-faint:#98A2B3;
  --brand:#6366F1; --brand-hover:#4F46E5; --brand-soft:#EEF0FF; --brand-shadow:0 6px 16px rgba(99,102,241,.28);
  --accent-2:#8B5CF6;
  --success:#22C55E; --success-soft:#E7F6EE; --warn:#F5B301; --warn-soft:#FFF4D6;
  --danger:#EF4444; --danger-soft:#FEE4E4; --info:#3B82F6; --info-soft:#E8F0FE;
  --chip-done-bg:#DCFCE7; --chip-done-text:#166534;
  --chip-trans-bg:#DBEAFE; --chip-trans-text:#1E40AF;
  --chip-analysis-bg:#EDE9FE; --chip-analysis-text:#5B21B6;
  --chip-error-bg:#FEE2E2; --chip-error-text:#991B1B;
  --chip-queue-bg:#F1F5F9; --chip-queue-text:#475569;
  --chip-live-bg:#FEE2E2; --chip-live-text:#991B1B;
  --r-pill:999px; --r-xl:20px; --r-lg:16px; --r-md:12px; --r-sm:10px; --r-xs:8px;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-8:32px;--s-10:40px;
  --sh-sm:0 1px 2px rgba(16,24,40,.04); --sh-md:0 4px 16px rgba(16,24,40,.06); --sh-lg:0 12px 36px rgba(16,24,40,.14);
  --dur:180ms; --ease:cubic-bezier(.2,.7,.2,1);
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:20px;--fs-2xl:28px;--fs-3xl:36px;
  --navbar-h:60px; --page-max:1400px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font-sans);font-size:var(--fs-md);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:transparent}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;outline:none}
svg{display:inline-block;vertical-align:middle;flex-shrink:0}

.app-shell{max-width:var(--page-max);margin:0 auto;padding:0 var(--s-6) var(--s-10)}
.page-title{font-size:var(--fs-2xl);font-weight:700;margin:var(--s-6) 0 var(--s-5);letter-spacing:-0.02em}
.page-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--s-4);margin:var(--s-6) 0 var(--s-5)}
.page-header .page-title{margin:0}
.section-title{font-weight:600;font-size:15px;margin:0 0 var(--s-4);display:flex;align-items:center;justify-content:space-between;gap:var(--s-3)}
.muted{color:var(--text-muted)} .small{font-size:12.5px} .xs{font-size:12px}

/* navbar */
.navbar{height:var(--navbar-h);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--sh-sm);display:flex;align-items:center;gap:var(--s-5);padding:0 var(--s-3) 0 var(--s-5);margin:var(--s-5) auto;max-width:var(--page-max);width:calc(100% - var(--s-6)*2)}
.navbar__logo{display:flex;align-items:center;gap:var(--s-2);font-weight:700;font-size:14.5px;letter-spacing:-0.01em;padding-right:var(--s-4);white-space:nowrap}
.navbar__logo-icon{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--accent-2));display:inline-flex;align-items:center;justify-content:center;color:#fff}
.navbar__menu{display:flex;gap:2px;flex:1}
.navbar__item{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r-pill);color:var(--text-muted);font-weight:500;font-size:13.5px;transition:all var(--dur) var(--ease)}
.navbar__item svg{width:16px;height:16px}
.navbar__item.has-warn,.icon-btn.has-warn,.btn.has-warn{outline:2px solid var(--warn);outline-offset:1px;animation:attnPulse 2.2s ease-in-out infinite}
.navbar__item.has-danger{outline:2px solid var(--danger);outline-offset:1px;animation:attnPulseR 2.2s ease-in-out infinite}
@keyframes attnPulse{0%,100%{box-shadow:0 0 0 0 rgba(245,179,1,0)}50%{box-shadow:0 0 0 5px rgba(245,179,1,.28)}}
@keyframes attnPulseR{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 0 5px rgba(239,68,68,.25)}}
.navbar__item:hover{background:var(--brand-soft);color:var(--brand)}
.navbar__item.is-active{background:var(--brand);color:#fff;box-shadow:var(--brand-shadow)}
.navbar__actions{display:flex;align-items:center;gap:var(--s-2);position:relative}
.icon-btn{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text-muted);transition:all var(--dur) var(--ease);background:var(--surface-2);border:1px solid var(--border)}
.icon-btn:hover{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-soft)}
.icon-btn svg{width:17px;height:17px}
.navbar__name{height:36px;padding:0 14px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-pill);font-weight:600;font-size:13px;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;transition:all var(--dur) var(--ease);max-width:200px}
.navbar__name:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.navbar__name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);height:36px;padding:0 14px;border:1px solid transparent;border-radius:var(--r-sm);font-weight:500;font-size:13.5px;transition:all var(--dur) var(--ease);cursor:pointer;white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn-primary{background:var(--brand);color:#fff;box-shadow:var(--brand-shadow)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn-danger-outline{background:var(--surface);color:var(--danger);border:1.5px solid var(--danger)}
.btn-danger-outline:hover{background:var(--danger-soft)}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:var(--r-xs)}
.btn-icon{width:32px;height:32px;padding:0;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none !important}

/* period segmented */
.period-seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:3px}
.period-seg button{padding:6px 14px;border-radius:var(--r-pill);color:var(--text-muted);font-weight:500;font-size:13px;transition:all var(--dur) var(--ease)}
.period-seg button.is-active{background:var(--brand);color:#fff;box-shadow:var(--brand-shadow)}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s-5);box-shadow:var(--sh-sm)}
.card--pad-sm{padding:var(--s-4) var(--s-5)}
.card__title{font-size:13.5px;color:var(--text-muted);margin:0 0 var(--s-2);font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:var(--s-2)}
.card.is-clickable{cursor:pointer;transition:all var(--dur) var(--ease)}
.card.is-clickable:hover{border-color:var(--brand);box-shadow:var(--sh-md)}

.ov-top{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-4);margin-bottom:var(--s-5)}
.kpi__value{font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-0.02em;margin-top:2px}
.kpi__badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;background:var(--warn-soft);color:var(--warn)}
.kpi__badge--danger{background:var(--danger-soft);color:var(--danger)}
.ov-blocks{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-4)}

/* list rows */
.list-row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);cursor:pointer;transition:all var(--dur) var(--ease);border:1px solid transparent}
.list-row:hover{background:var(--surface-2);border-color:var(--border)}
.list-row + .list-row{margin-top:6px}
.list-row__name{font-weight:500;font-size:13.5px}
.list-row__sub{color:var(--text-muted);font-size:12px;margin-top:2px}
.list-row__right{color:var(--text-muted);font-size:12px;text-align:right;display:flex;align-items:center;gap:4px}

/* severity list rows */
.sev-row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:14px;border-radius:var(--r-md);cursor:pointer;transition:all var(--dur) var(--ease);border-left:3px solid var(--warn);background:var(--warn-soft)}
.sev-row.is-danger{border-left-color:var(--danger);background:var(--danger-soft)}
.sev-row + .sev-row{margin-top:10px}
.sev-row:hover{transform:translateX(2px)}
.sev-row__title{font-weight:600;font-size:13.5px}
.sev-row__sub{color:var(--text-muted);font-size:12px;margin-top:3px}
.sev-row__chip{background:rgba(0,0,0,.08);padding:3px 8px;border-radius:var(--r-pill);font-size:11px;font-weight:600;font-family:var(--font-mono)}

.live-badge{display:inline-flex;align-items:center;gap:5px;background:#DC2626;color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;line-height:1.2}
.live-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
/* unified status badges (всюди однакові) */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;line-height:1.3}
.badge--live{background:#FEE2E2;color:#B91C1C}
.badge--live::before{content:"";width:6px;height:6px;border-radius:50%;background:#DC2626;animation:pulse 1.4s infinite}
.badge--queue{background:#F1F5F9;color:#475569}
.badge--trans{background:#DBEAFE;color:#1D4ED8}
.badge--analysis{background:#EDE9FE;color:#6D28D9}
.badge--done{background:#DCFCE7;color:#15803D}
.badge--error{background:#FEE2E2;color:#B91C1C}
@keyframes pulse { 0%{opacity:1} 50%{opacity:.4} 100%{opacity:1} }

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);font-size:12px;font-weight:500;background:var(--chip-queue-bg);color:var(--chip-queue-text);white-space:nowrap}
.chip--done{background:var(--chip-done-bg);color:var(--chip-done-text)}
.chip--trans{background:var(--chip-trans-bg);color:var(--chip-trans-text)}
.chip--analysis{background:var(--chip-analysis-bg);color:var(--chip-analysis-text)}
.chip--error{background:var(--chip-error-bg);color:var(--chip-error-text)}
.chip--live{background:var(--chip-live-bg);color:var(--chip-live-text)}


/* score ring */
.score-ring{--val:0;--stroke:var(--border-strong);border-radius:50%;background:conic-gradient(var(--stroke) calc(var(--val) * 1%),var(--border) 0);display:inline-flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.score-ring::before{content:"";position:absolute;inset:5px;background:var(--surface);border-radius:50%}
.score-ring--na{background:transparent;border:2px dashed var(--border-strong);box-sizing:border-box}
.score-ring--na::before{display:none}
.score-ring__text{position:relative;z-index:1;font-size:11px;font-weight:700;color:var(--text)}
.calls-row__cell .score-ring__text{font-size:11px}

/* recent row (overview right block) */
.recent-row{display:grid;grid-template-columns:40px 1fr auto 56px;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);cursor:pointer;transition:all var(--dur) var(--ease);border:1px solid transparent}
.recent-row:hover{background:var(--surface-2);border-color:var(--border)}
.recent-row + .recent-row{margin-top:4px}
.recent-row__name{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-row__sub{color:var(--text-muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}


/* calls — separated row-cards */
.calls-grid{display:grid;grid-template-columns:120px 220px 180px 1fr 190px 90px 24px;gap:0 var(--s-4);align-items:center}
.calls-head{padding:0 var(--s-4);margin-bottom:var(--s-3);color:var(--text-muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.calls-head > div{padding:0 2px}
.calls-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px var(--s-4);cursor:pointer;transition:all var(--dur) var(--ease);box-shadow:var(--sh-sm)}
.calls-row + .calls-row{margin-top:8px}
.calls-row:hover{border-color:var(--brand);box-shadow:var(--sh-md)}
.calls-row__cell{min-width:0;overflow:hidden}
.calls-row__cell.truncate{text-overflow:ellipsis;white-space:nowrap}
.pbar{height:6px;background:var(--surface-2,#e8eaf2);border-radius:99px;overflow:hidden}
.pbar>span{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .5s}
.pbar--mini{position:absolute;left:0;right:0;bottom:-3px;height:3px}
.cv-prog{margin:0 24px 6px;padding:10px 14px;border:1px solid var(--border,#e3e6ef);border-radius:12px;background:var(--surface,#fff)}
.cv-prog__top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.cv-prog__steps{display:flex;gap:14px;font-size:12px;color:var(--text-muted)}
.cv-prog__steps .is-on{color:var(--text);font-weight:600}.cv-prog__steps .is-done{color:var(--success,#16a34a)}
.calls-act{padding:2px 9px;min-width:30px;line-height:1.4;flex:none}
.calls-empty{background:var(--surface);border:1px dashed var(--border);border-radius:var(--r-md);padding:40px 20px;text-align:center;color:var(--text-muted);font-size:13.5px}
@media (max-width:1100px){
  .calls-grid{grid-template-columns:1fr 1fr}
  .calls-head{display:none}
  .calls-row{display:flex;flex-wrap:wrap;gap:10px}
}


/* ===== call detail modal (centered, with backdrop) ===== */
.cv-overlay{position:fixed;inset:0;background:rgba(16,24,40,.55);z-index:300;display:flex;align-items:stretch;justify-content:center;padding:5px;overflow:hidden;backdrop-filter:blur(4px)}
.cv-modal{background:var(--surface);border-radius:16px;box-shadow:var(--sh-lg);width:100%;max-width:none;height:calc(100vh - 10px);overflow:hidden;display:flex;flex-direction:column;animation:cv-pop .18s var(--ease)}
@keyframes cv-pop{from{transform:translateY(6px);opacity:0}to{transform:translateY(0);opacity:1}}
.cv-modal__header{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.cv-modal__title{font-size:18px;font-weight:700;letter-spacing:-0.01em;margin:0}
.cv-modal__sub{color:var(--text-muted);font-size:12.5px;margin-top:2px}
.cv-modal__close{width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);transition:all var(--dur) var(--ease);flex-shrink:0}
.cv-modal__close:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.cv-modal__body{flex:1;overflow:hidden;padding:20px 24px 24px;background:var(--bg);display:flex;min-height:0}
.cv-modal__body--plain{background:var(--surface);overflow-y:auto;display:block;padding:28px 32px 32px}
.cv-modal--sm{max-width:520px;height:auto;max-height:calc(100vh - 60px);margin:30px auto;align-self:center}
.cv-form{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.cv-field{display:flex;flex-direction:column;gap:8px}
.cv-field > label{font-size:12.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.cv-field > input,.cv-field > textarea{padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit}
.cv-field > input:focus,.cv-field > textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);outline:none}
.cv-hint{color:var(--text-muted);font-size:12.5px;line-height:1.5;margin-top:-10px}
.cv-form__actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;padding-top:16px;border-top:1px solid var(--border)}
/* ===== call detail (fullscreen view) ===== */
.cv-head{display:flex;align-items:center;gap:12px;margin:var(--s-5) 0 var(--s-4)}
.cv-head__title{font-size:22px;font-weight:700;letter-spacing:-0.02em;margin:0}
.cv-head__sub{color:var(--text-muted);font-size:13px}
.cv-back{display:inline-flex;align-items:center;gap:6px;padding:0 10px;height:34px;border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);background:var(--surface);font-weight:500;font-size:13px;cursor:pointer;transition:all var(--dur) var(--ease)}
.cv-back:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.cv-grid{display:flex;gap:var(--s-5);width:100%;min-height:0;flex:1}
.cv-pane-left{flex:1.5;overflow-y:auto;padding-right:4px;min-width:0}
.cv-pane-right-flex{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.cv-tabs{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:3px;margin-bottom:var(--s-4);position:sticky;top:0;z-index:5;box-shadow:0 4px 10px rgba(243,245,251,.9)}
.cv-pane-left{position:relative}
.cv-pane-left::before{content:"";position:sticky;top:0;display:block;height:0}
.cv-tabs button{padding:7px 16px;border-radius:var(--r-pill);color:var(--text-muted);font-weight:500;font-size:13.5px;transition:all var(--dur) var(--ease)}
.cv-tabs button.is-active{background:var(--brand);color:#fff;box-shadow:var(--brand-shadow)}
.cv-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s-5);box-shadow:var(--sh-sm);margin-bottom:var(--s-4)}
.cv-card--warn{border-left:4px solid var(--warn);background:var(--warn-soft)}
.cv-card--crit{border-left:4px solid var(--danger);background:var(--danger-soft)}
.cv-card--pain{border-left:4px solid var(--warn);background:#FFFBEB}
.cv-card--obj{border-left:4px solid #8B5CF6;background:#F5F3FF}
.cv-card__title{font-weight:600;font-size:14px;margin-bottom:6px}
.cv-card__body{color:var(--text-muted);font-size:13.5px;line-height:1.5}
.tc{display:inline-flex;align-items:center;gap:3px;background:var(--brand-soft);color:var(--brand);padding:3px 10px;border-radius:var(--r-sm);font-family:var(--font-mono);font-size:12px;font-weight:600;cursor:pointer;border:0;transition:all var(--dur) var(--ease);margin-right:6px}
.tc:hover{background:var(--brand);color:#fff}
.cv-player{position:relative}
.cv-player__video{width:100%;aspect-ratio:16/9;border-radius:var(--r-md);overflow:hidden;background:#000;box-shadow:var(--sh-md)}
.cv-player__video.is-fixed{aspect-ratio:auto}
.cv-player__placeholder.is-fixed{aspect-ratio:auto}
.cv-splitter{height:14px;cursor:row-resize;position:relative;flex-shrink:0;margin:2px 0}
.cv-splitter::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:4px;background:var(--border-strong);border-radius:3px;transition:background .18s ease,width .18s ease}
.cv-splitter:hover::before,.cv-splitter.is-drag::before{background:var(--brand);width:60px}
body.is-row-resizing{cursor:row-resize;user-select:none}
.drag-shield{position:fixed;inset:0;z-index:9999;cursor:row-resize;background:transparent}
.cv-player__video iframe{width:100%;height:100%;border:0;display:block}
.cv-player__placeholder{width:100%;aspect-ratio:16/9;border-radius:var(--r-md);background:linear-gradient(135deg,#1E293B,#334155);display:flex;align-items:center;justify-content:center;color:#94A3B8;font-size:13px;box-shadow:var(--sh-md)}
.cv-quote{display:block;margin-top:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;color:var(--text);cursor:pointer;transition:all var(--dur) var(--ease);line-height:1.5}
.cv-quote:hover{border-color:var(--brand);background:var(--brand-soft)}
.cv-quote__time{font-family:var(--font-mono);font-size:11px;color:var(--brand);font-weight:600;margin-right:6px}
.cv-quote__role{display:inline-block;width:18px;text-align:center;font-weight:700;font-size:11px;color:var(--text-muted);background:var(--surface-2);border-radius:3px;padding:1px 0;margin-right:6px}
.tr-line{transition:background .4s ease}
.tr-line.is-hl{background:var(--brand-soft);border-radius:var(--r-sm)}
.tr-box{max-height:none;overflow:visible;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}
.tr-plain{font-size:13.5px;line-height:1.7;padding:3px 6px;border-radius:4px;cursor:pointer;transition:background .25s ease;white-space:pre-wrap}
.tr-plain:hover{background:#fff}
.tr-plain.is-hl{background:#FEF08A !important;box-shadow:inset 2px 0 0 var(--warn)}
.btn-icon.btn-ghost{border:1px solid var(--border);background:var(--surface);color:var(--text-muted)}
.btn-icon.btn-ghost:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.btn-icon.btn-primary{background:var(--brand);color:#fff}
.btn-icon.btn-primary:hover{background:var(--brand-hover)}
/* summary sections */
.cv-summary{display:flex;flex-direction:column;gap:14px}
.cv-summary__item{padding-left:12px;border-left:3px solid var(--brand-soft)}
.cv-summary__h{font-weight:600;font-size:13.5px;color:var(--brand);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.cv-summary__p{color:var(--text);font-size:13.5px;line-height:1.55}
/* score with criteria */
.cv-score{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 6px;margin-bottom:var(--s-3);box-shadow:var(--sh-sm)}
.cv-crit-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:0;align-items:stretch}
.cv-crit-cell{display:grid;grid-template-rows:auto auto auto;align-items:center;justify-items:center;text-align:center;padding:6px 4px;position:relative;row-gap:4px}
.cv-crit-cell + .cv-crit-cell{border-left:1px solid var(--border)}
.cv-crit-cell__name{font-size:11px;min-height:28px;color:var(--text-muted);font-weight:500;line-height:1.35;display:flex;align-items:center;justify-content:center}
.cv-crit-cell__w{font-size:9.5px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em;align-self:start}
.cv-crit-cell--main .cv-crit-cell__name{color:var(--text);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
.cv-crit-cell--click{cursor:pointer;border-radius:10px;transition:background .15s}
.cv-crit-cell--click:hover{background:var(--surface-2,#f1f3fa)}
.crit{border-bottom:1px solid var(--border);padding:2px 0}
.crit:last-child{border-bottom:0}
.crit__head{cursor:pointer;padding:10px 4px;border-radius:8px}
.crit__head:hover{background:var(--surface-2,#f6f7fb)}
.crit__top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.crit__chev{display:inline-block;transition:transform .2s;color:var(--text-muted);margin-right:6px;font-size:11px}
.crit.is-open .crit__chev{transform:rotate(90deg)}
.crit__wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.crit.is-open .crit__wrap{grid-template-rows:1fr}
.crit__wrap>div{overflow:hidden}
.crit__body{padding:4px 6px 12px 22px}
.crit__why{font-size:13px;line-height:1.5}
.crit__rel{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2,#f6f7fb)}
.cv-pane-right{flex:1 1 0;display:flex;flex-direction:column;min-height:0;min-width:0;height:100%}
.cv-chat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s-4);margin-top:var(--s-4);box-shadow:var(--sh-sm);display:flex;flex-direction:column;flex:1 1 0;min-height:0;overflow:hidden}
.cv-chat__head{font-weight:600;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.cv-chat__list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;padding-right:4px}
.cv-chat__msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.4}
.cv-chat__msg.is-user{background:var(--brand-soft);color:var(--text);align-self:flex-end;border-bottom-right-radius:4px}
.cv-chat__msg.is-ai{background:var(--surface-2);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.cv-chat__msg{white-space:pre-wrap;word-break:break-word}
.cv-chat__msg.is-pending{opacity:.65;font-style:italic}
.cv-chat__msg.is-err{border-color:var(--danger);color:var(--danger)}
.cv-chat__msg .tc{margin:0 2px;padding:1px 6px}
.cv-chat__msg.is-streaming::after{content:' ▍';animation:cvblink 1s steps(1) infinite}
@keyframes cvblink{50%{opacity:0}}
.cv-chat__msg.is-stopped{opacity:.85}
.cv-chat__stopnote{font-size:12px;color:var(--text-muted);font-style:italic}
.cv-chat__form button.is-stop{background:var(--danger)}
.cv-chat__form button.is-stop:hover{background:var(--danger);filter:brightness(.92)}
.cv-chat__quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cv-chat__quick button{padding:5px 10px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-pill);font-size:12px;color:var(--text-muted);cursor:pointer;transition:all var(--dur) var(--ease)}
.cv-chat__quick button:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.cv-chat__form{display:flex;gap:8px}
.cv-chat__form input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);font-size:13.5px}
.cv-chat__form input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);outline:none}
.cv-chat__form button{background:var(--brand);color:#fff;border-radius:var(--r-sm);padding:0 14px;font-weight:500;font-size:13px;cursor:pointer}
.cv-chat__form button:hover{background:var(--brand-hover)}
.tr-line{display:grid;grid-template-columns:60px 24px 1fr;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border);align-items:start}
.tr-line:last-child{border-bottom:0}
.tr-line__t{font-family:var(--font-mono);font-size:12px;color:var(--brand);cursor:pointer;font-weight:600;padding:2px 0}
.tr-line__r{font-weight:700;font-size:12px;color:var(--text-muted);text-align:center;background:var(--surface-2);border-radius:4px;padding:2px 0;height:fit-content}
.tr-line__r.is-m{color:var(--brand);background:var(--brand-soft)}
.tr-line__r.is-k{color:var(--text);background:var(--surface-2)}
.tr-line__txt{font-size:13.5px;line-height:1.5;color:var(--text)}
.ov-score{display:flex;align-items:center;gap:14px;padding:var(--s-4);background:var(--surface-2);border-radius:var(--r-md);margin-bottom:var(--s-4)}
@media (max-width:1100px){ .cv-grid{grid-template-columns:1fr} .cv-player{position:static} }

/* toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--text);color:#fff;padding:10px 20px;border-radius:var(--r-pill);font-size:13px;font-weight:500;box-shadow:var(--sh-lg);z-index:500;opacity:0;transition:all .25s var(--ease);pointer-events:none;display:inline-flex;align-items:center;gap:8px}
.toast.is-show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast--ok{background:var(--success)}
.toast--err{background:var(--danger)}

/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#F3F5FB 0%,#E8EBF5 100%)}
.login-card{width:100%;max-width:380px;padding:28px}
.login-field{display:block;width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--r-sm);margin-top:6px;background:var(--surface);color:var(--text)}
.login-field:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.login-err{color:var(--danger);font-size:13px;min-height:18px;margin-top:4px}
.login-label{font-size:13px;color:var(--text-muted);font-weight:500}

/* table */
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;padding:12px 16px;font-weight:500;color:var(--text-muted);font-size:12px;background:var(--surface-2);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.03em}
.table td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
.table tr:last-child td{border-bottom:0}

.input{padding:0 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);font-size:13.5px;color:var(--text);height:38px}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input--search{min-width:260px;padding-left:38px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B7390' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'/><path d='M21 21l-4.3-4.3'/></svg>");background-repeat:no-repeat;background-position:12px center;background-size:16px}

/* custom styled dropdown */
.dd{position:relative}
.dd__btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font-size:13.5px;font-weight:500;cursor:pointer;transition:all var(--dur) var(--ease);min-width:180px;justify-content:space-between}
.dd__btn:hover{border-color:var(--brand);background:var(--brand-soft)}
.dd__btn.is-open{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.dd__btn svg{color:var(--text-muted);transition:transform var(--dur) var(--ease)}
.dd__btn.is-open svg{transform:rotate(180deg)}
.dd__btn-left{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
.dd__btn-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd__pop{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-lg);min-width:100%;z-index:50;padding:6px;max-height:320px;overflow:auto}
.dd__item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:13.5px;color:var(--text);transition:background var(--dur) var(--ease)}
.dd__item:hover{background:var(--brand-soft);color:var(--brand)}
.dd__item.is-active{background:var(--brand);color:#fff}
.dd__item.is-active .ava{background:rgba(255,255,255,.2);color:#fff}

/* custom calendar (date range) */
.cal{width:300px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-lg)}
.cal__head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal__title{font-weight:600;font-size:14px;text-transform:capitalize}
.cal__nav{display:flex;gap:4px}
.cal__nav button{width:28px;height:28px;border-radius:50%;color:var(--text-muted);display:inline-flex;align-items:center;justify-content:center}
.cal__nav button:hover{background:var(--surface-2);color:var(--text)}
.cal__grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal__dow{text-align:center;font-size:11px;color:var(--text-muted);text-transform:uppercase;padding:4px 0;font-weight:600}
.cal__day{text-align:center;padding:7px 0;font-size:13px;border-radius:var(--r-xs);cursor:pointer;position:relative;color:var(--text);transition:all var(--dur) var(--ease)}
.cal__day:hover:not(.is-muted){background:var(--brand-soft);color:var(--brand)}
.cal__day.is-muted{color:var(--text-faint);cursor:default}
.cal__day.is-today{font-weight:700;color:var(--brand)}
.cal__day.is-start,.cal__day.is-end{background:var(--brand) !important;color:#fff !important;font-weight:600;z-index:1}
.cal__day.is-in-range{background:var(--brand-soft);color:var(--brand);border-radius:0}
.cal__day.is-start{border-top-right-radius:0;border-bottom-right-radius:0}
.cal__day.is-end{border-top-left-radius:0;border-bottom-left-radius:0}
.cal__day.is-start.is-end{border-radius:var(--r-xs)}
.cal__footer{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.cal__footer button{font-size:13px;color:var(--brand);font-weight:600;padding:4px 8px;border-radius:var(--r-xs)}
.cal__footer button:hover{background:var(--brand-soft)}
.cal__quick{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.cal__quick button{padding:4px 10px;border:1px solid var(--border);border-radius:var(--r-pill);font-size:12px;color:var(--text-muted);transition:all var(--dur) var(--ease)}
.cal__quick button:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.5);display:flex;align-items:center;justify-content:center;z-index:400;padding:20px}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:24px;width:100%;max-width:460px;box-shadow:var(--sh-lg);max-height:calc(100vh - 40px);overflow-y:auto;overflow-x:hidden;box-sizing:border-box}
.modal *{min-width:0;overflow-wrap:anywhere}
.x-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);font-size:18px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all var(--dur) var(--ease)}
.x-close:hover{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.yt-box{padding:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:14px}
.yt-box ol{margin:8px 0 0 18px;padding:0;font-size:13px;line-height:1.55;color:var(--text-muted)}
.yt-box li{margin-bottom:4px}
.modal.modal-wide{max-width:720px}
.modal h2{margin:0 0 16px;font-size:18px;letter-spacing:-0.01em}
.modal-row{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.modal-row > label{font-size:12.5px;color:var(--text-muted);font-weight:500}
.modal-row input,.modal-row select,.modal-row textarea{padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font-family:inherit}
.modal-row input:focus,.modal-row select:focus,.modal-row textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* avatar */
.ava{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;overflow:hidden;font-weight:600;font-size:13px;flex-shrink:0}
.ava img{width:100%;height:100%;object-fit:cover}
.ava--sm{width:30px;height:30px;font-size:12px}
.ava--lg{width:64px;height:64px;font-size:20px;border-radius:16px}
.ava--sm{border-radius:8px}
.dropzone{border:2px dashed var(--border-strong);border-radius:14px;padding:16px;text-align:center;cursor:pointer;color:var(--text-muted);font-size:13px;transition:all var(--dur) var(--ease)}
.dropzone.is-over,.dropzone:hover{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}

/* filters bar */
.filters{display:flex;gap:var(--s-3);flex-wrap:wrap;align-items:center;margin-bottom:var(--s-4)}
.filters > *{flex-shrink:0}

/* tabs */
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:3px;overflow:hidden;flex-wrap:wrap}
.tabs button{padding:7px 14px;border-radius:var(--r-pill);color:var(--text-muted);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.tabs button.is-active{background:var(--brand);color:#fff;box-shadow:var(--brand-shadow)}
.tabs .tab-count{background:rgba(0,0,0,.08);padding:1px 7px;border-radius:var(--r-pill);font-size:11px;font-weight:600}
.tabs .is-active .tab-count{background:rgba(255,255,255,.25)}

/* progress bars */
.bar{position:relative;height:8px;background:var(--surface-2);border-radius:var(--r-pill);overflow:hidden}
.bar>span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--brand),var(--accent-2));border-radius:var(--r-pill)}

/* responsive */
@media (max-width:1100px){ .ov-top{grid-template-columns:1fr 1fr} .ov-blocks{grid-template-columns:1fr} }
@media (max-width:900px){ .navbar__menu{display:none} .filters .input--search{min-width:0;flex:1} }

.loading{color:var(--text-muted);padding:var(--s-5);text-align:center}
.row-disabled{opacity:.55}
.empty{color:var(--text-muted);text-align:center;padding:32px 20px;font-size:13.5px}
</style>

/* ---------- DOM helper ---------- */
function el(tag, attrs){
  const n=document.createElement(tag);
  attrs=attrs||{};
  for (const k in attrs){
    const v=attrs[k]; if (v==null) continue;
    if (k==="class") n.className=v;
    else if (k==="style") n.setAttribute("style",v);
    else if (k.startsWith("on") && typeof v==="function") n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v);
  }
  for (let i=2;i<arguments.length;i++){
    const kids=Array.isArray(arguments[i])?arguments[i]:[arguments[i]];
    for (const kid of kids){ if (kid==null) continue; n.appendChild(kid instanceof Node?kid:document.createTextNode(String(kid))); }
  }
  return n;
}
function toast(text, kind){
  const t = document.createElement("div");
  t.className = "toast" + (kind==="err"?" toast--err":" toast--ok");
  t.textContent = text;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("is-show"));
  setTimeout(()=>{ t.classList.remove("is-show"); setTimeout(()=>t.remove(), 300); }, 1800);
}

function fmtDur(s){ if (!s) return "—"; const m=Math.floor(s/60), ss=s%60; return (m<10?"0":"")+m+":"+(ss<10?"0":"")+ss; }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function fmtDateShort(d){ return d.toLocaleDateString("uk-UA",{day:"2-digit",month:"short"}); }
function fmtTime(iso){ const d=new Date(iso); return d.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"}); }
function fmtTimeRange(startedAtIso, durationSec, status){
  if (status==="live") return "в ефірі";
  if (!durationSec) return "—";
  const m = Math.floor(durationSec/60), sec = durationSec%60;
  if (m >= 60){ const h = Math.floor(m/60), mm = m%60; return h+" год "+mm+" хв"; }
  if (m >= 1) return m+" хв";
  return sec+" с";
}
function initials(name){ if (!name) return "?"; const p=name.trim().split(/\s+/); return (p[0][0]+(p[1]?p[1][0]:"")).toUpperCase(); }
function scoreRing(v, size){
  size = size || 44;
  const val = Math.max(0, Math.min(100, Number(v)||0));
  const color = val>=80?"var(--success)":val>=60?"var(--warn)":val>0?"var(--danger)":"var(--border-strong)";
  const d = el("div",{class:"score-ring", style:"width:"+size+"px;height:"+size+"px;--val:"+val+";--stroke:"+color+";"},
    el("span",{class:"score-ring__text"}, val+"%"));
  return d;
}

function sparkline(data, color){
  const w=120, h=36;
  if (!data||data.length<2) return el("div",{style:"height:"+h+"px;"});
  const max=Math.max.apply(null,data), min=Math.min.apply(null,data), span=Math.max(1,max-min), step=w/(data.length-1);
  const pts = data.map(function(v,i){ return (i*step).toFixed(1)+","+(h-((v-min)/span)*(h-6)-3).toFixed(1); }).join(" ");
  const svgNS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(svgNS,"svg");
  svg.setAttribute("viewBox","0 0 "+w+" "+h); svg.setAttribute("width","100%"); svg.setAttribute("height",h);
  const line=document.createElementNS(svgNS,"polyline");
  line.setAttribute("points",pts); line.setAttribute("fill","none"); line.setAttribute("stroke", color||"var(--brand)");
  line.setAttribute("stroke-width","2"); line.setAttribute("stroke-linecap","round"); line.setAttribute("stroke-linejoin","round");
  svg.appendChild(line); return svg;
}

function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }

function userAva(u, size){
  const cls = "ava"+(size==="sm"?" ava--sm":size==="lg"?" ava--lg":"");
  if (u && u.photoURL) return el("div",{class:cls}, el("img",{src:u.photoURL,alt:""}));
  return el("div",{class:cls}, initials((u&&(u.name||u.email))||"?"));
}

/* ---------- Floating util: close on outside click ---------- */
function closeOnOutside(popNode, triggerNode, onClose){
  const h=(ev)=>{ if (!popNode.contains(ev.target) && ev.target!==triggerNode && !triggerNode.contains(ev.target)){ onClose(); document.removeEventListener("mousedown", h, true); } };
  setTimeout(()=>document.addEventListener("mousedown", h, true), 0);
}

/* ---------- Custom styled dropdown ---------- */
function dropdown({ value, options, onChange, placeholder="Виберіть", renderItem, renderButton }){
  const wrap = el("div",{class:"dd"});
  const btnLabelWrap = el("span",{class:"dd__btn-left"});
  const btn  = el("button",{class:"dd__btn"}, btnLabelWrap, ICONS.chevronDown());
  let curVal = value;
  let pop = null, outside = null;
  function paintBtn(){
    btnLabelWrap.replaceChildren();
    const cur = options.find(o=>o.value===curVal);
    if (!cur){ btnLabelWrap.append(el("span",{class:"dd__btn-label muted"}, placeholder)); return; }
    if (renderButton) btnLabelWrap.append(renderButton(cur));
    else btnLabelWrap.append(el("span",{class:"dd__btn-label"}, cur.label));
  }
  paintBtn();
  function close(){
    if (!pop) return;
    pop.remove(); pop=null; btn.classList.remove("is-open");
    if (outside){ document.removeEventListener("mousedown", outside, true); outside=null; }
  }
  function open(){
    if (pop) return;
    pop = el("div",{class:"dd__pop"},
      options.map(o => el("div",{class:"dd__item"+(o.value===curVal?" is-active":""),
        onclick: ()=>{ curVal=o.value; paintBtn(); close(); onChange(o.value); }
      }, renderItem?renderItem(o):el("span",{},o.label)))
    );
    wrap.appendChild(pop);
    btn.classList.add("is-open");
    outside = (ev)=>{ if (pop && !pop.contains(ev.target) && !btn.contains(ev.target)) close(); };
    setTimeout(()=>document.addEventListener("mousedown", outside, true), 0);
  }
  btn.addEventListener("click",(e)=>{ e.stopPropagation(); if (pop) close(); else open(); });
  wrap.appendChild(btn);
  return wrap;
}

/* ---------- Date range picker (Monobank-style) ---------- */
const UK_MONTHS = ["січень","лютий","березень","квітень","травень","червень","липень","серпень","вересень","жовтень","листопад","грудень"];
const UK_DOW    = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];

function dateRangeBtn({ start, end, onChange, defaultRange }){
  let _s = start, _e = end;
  const _oc = onChange;
  onChange = (r) => { _s = r.start; _e = r.end; _oc(r); };
  const btn = el("button",{class:"dd__btn", style:"min-width:220px;"},
    el("span",{class:"dd__btn-left"}, ICONS.calendar(), el("span",{class:"dd__btn-label"})),
    ICONS.chevronDown());
  function paint(){
    const lbl = btn.querySelector(".dd__btn-label");
    if (!_s && !_e) lbl.textContent = "Будь-яка дата";
    else if (_s && _e && sameDay(_s,_e)) lbl.textContent = fmtDateShort(_s);
    else if (_s && _e) lbl.textContent = fmtDateShort(_s)+" — "+fmtDateShort(_e);
    else if (_s) lbl.textContent = "З "+fmtDateShort(_s);
    else lbl.textContent = "По "+fmtDateShort(_e);
  }
  paint();
  let pop=null;
  btn.addEventListener("click",(e)=>{
    e.stopPropagation();
    if (pop){ pop.remove(); pop=null; btn.classList.remove("is-open"); return; }
    let viewDate = new Date(_s || new Date()); viewDate.setDate(1);
    let s=_s?new Date(_s):null, en=_e?new Date(_e):null;
    pop = buildCalendar();
    btn.parentNode.appendChild(pop); // same parent as btn (wrapper)
    btn.classList.add("is-open");
    closeOnOutside(pop, btn, ()=>{ if (pop){ pop.remove(); pop=null; btn.classList.remove("is-open"); } });

    function buildCalendar(){
      const node = el("div",{class:"cal", style:"position:absolute;top:calc(100% + 6px);left:0;z-index:50;"});
      renderCal(node);
      return node;
    }
    function renderCal(node){
      const y = viewDate.getFullYear(), m = viewDate.getMonth();
      const first = new Date(y,m,1);
      const startDow = (first.getDay()+6)%7; // Mon=0
      const daysInMonth = new Date(y,m+1,0).getDate();
      const prevMonthDays = new Date(y,m,0).getDate();
      const today = new Date();

      const grid = el("div",{class:"cal__grid"});
      // dow row
      for (const d of UK_DOW) grid.appendChild(el("div",{class:"cal__dow"},d));
      // leading muted
      for (let i=0;i<startDow;i++){
        grid.appendChild(el("div",{class:"cal__day is-muted"}, String(prevMonthDays-startDow+1+i)));
      }
      for (let d=1; d<=daysInMonth; d++){
        const cur = new Date(y,m,d);
        const classes = ["cal__day"];
        if (sameDay(cur, today)) classes.push("is-today");
        if (s && en){
          if (sameDay(cur,s)) classes.push("is-start");
          if (sameDay(cur,en)) classes.push("is-end");
          if (cur>s && cur<en) classes.push("is-in-range");
        } else if (s){
          if (sameDay(cur,s)) { classes.push("is-start"); classes.push("is-end"); }
        }
        const dayEl = el("div",{class:classes.join(" "), onclick:()=>{
          if (!s || (s && en)){
            s = new Date(y,m,d); en = null;
          } else if (s && !en){
            const picked = new Date(y,m,d);
            if (picked < s){ en = s; s = picked; } else { en = picked; }
          }
          renderCal(node);
          // onChange НЕ викликаємо — застосуємо лише на «Готово».
        }}, String(d));
        grid.appendChild(dayEl);
      }
      // trailing muted
      const total = startDow + daysInMonth;
      const tail = (7 - (total%7)) % 7;
      for (let i=1;i<=tail;i++) grid.appendChild(el("div",{class:"cal__day is-muted"}, String(i)));

      const head = el("div",{class:"cal__head"},
        el("div",{class:"cal__title"}, UK_MONTHS[m]+" "+y),
        el("div",{class:"cal__nav"},
          el("button",{onclick:()=>{ viewDate.setMonth(viewDate.getMonth()-1); renderCal(node); }}, ICONS.chevronLeft()),
          el("button",{onclick:()=>{ viewDate.setMonth(viewDate.getMonth()+1); renderCal(node); }}, ICONS.chevronRight())));

      const quick = el("div",{class:"cal__quick"},
        el("button",{onclick:()=>{ const t=new Date(); s=new Date(t); en=new Date(t); viewDate=new Date(t); viewDate.setDate(1); renderCal(node); onChange({start:s,end:en}); paint(); }},"Сьогодні"),
        el("button",{onclick:()=>{ const t=new Date(); s=new Date(t); s.setDate(t.getDate()-6); en=new Date(t); viewDate=new Date(s); viewDate.setDate(1); renderCal(node); onChange({start:s,end:en}); paint(); }},"7 днів"),
        el("button",{onclick:()=>{ const t=new Date(); s=new Date(t); s.setDate(t.getDate()-29); en=new Date(t); viewDate=new Date(s); viewDate.setDate(1); renderCal(node); onChange({start:s,end:en}); paint(); }},"30 днів"),
        el("button",{onclick:()=>{ const t=new Date(); s=new Date(t.getFullYear(),t.getMonth(),1); en=new Date(t); viewDate=new Date(s); renderCal(node); onChange({start:s,end:en}); paint(); }},"Цей місяць"),
        el("button",{onclick:()=>{ s=null; en=null; renderCal(node); onChange({start:null,end:null}); paint(); }},"Весь час"));

      const footer = el("div",{class:"cal__footer"},
        el("button",{onclick:()=>{ const dr = defaultRange ? defaultRange() : {start:null,end:null}; s=dr.start; en=dr.end; renderCal(node); onChange({start:s,end:en}); paint(); }},"Очистити"),
        el("button",{onclick:()=>{
          // Якщо вибрали лише одну дату — вважаємо її і початком, і кінцем.
          if (s && !en) en = new Date(s);
          onChange({ start:s, end:en });
          paint();
          if (pop){ pop.remove(); pop=null; btn.classList.remove("is-open"); }
        }},"Готово"));

      node.replaceChildren(head, quick, grid, footer);
    }
  });
  const wrap = el("div",{class:"dd", style:"position:relative;"}, btn);
  return wrap;
}

/* ---------- Firestore API ---------- */
async function getCurrentUser(){
  const u=auth.currentUser; if (!u) return null;
  const mail = String(u.email||"").toLowerCase();
  let snap=await db.collection("users").doc(mail).get();
  if (!snap.exists && mail !== u.email) snap=await db.collection("users").doc(u.email).get();   // старі документи з великими літерами
  const d=snap.exists?snap.data():{};
  // self-heal: записать auth uid в users/{email}, если его там ещё нет
  if (snap.exists && !d.uid){
    try { await snap.ref.update({ uid: u.uid }); d.uid = u.uid; }
    catch(_){}
  }
  if (d.status==="deleted"){ try { await auth.signOut(); } catch(_){} return null; }   // видалений менеджер не заходить
  return { uid:u.uid, email:d.email||u.email, name:d.name||u.email.split("@")[0],
           role:d.role||ROLES.MANAGER, status:d.status||"active", aiBlocked:!!d.aiBlocked,
           promotedBy:d.promotedBy||null, photoURL:d.photoURL||null };
}
async function listUsers(){
  const qs=await db.collection("users").get();
  return qs.docs.map(s=>{
    const d=s.data();
    const isDel = d.status==="deleted";
    return { uid:s.id, email:d.email||s.id, name:(d.name||s.id.split("@")[0]) + (isDel ? " (видалений)" : ""), deleted:isDel, deletedAtMs:(d.deletedAt&&d.deletedAt.toMillis)?d.deletedAt.toMillis():0,
             role:d.role||ROLES.MANAGER, status:d.status||"active", aiBlocked:!!d.aiBlocked,
             promotedBy:d.promotedBy||null, photoURL:d.photoURL||null };
  });
}

async function createNewUser(email,password,role,actorUid,name){
  email = String(email||"").trim().toLowerCase();   // Firebase Auth зберігає email малими літерами; id документа має збігатись
  const sec = firebase.apps.find(a=>a.name==="sec") || firebase.initializeApp(FIREBASE_CONFIG,"sec");
  const secAuth = sec.auth();
  const cred = await secAuth.createUserWithEmailAndPassword(email,password);
  await db.collection("users").doc(email).set({
    email, uid: cred.user.uid, role, name: name || email.split("@")[0],
    status:"active", promotedBy:actorUid,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  });
  await secAuth.signOut();
  return cred.user.uid;
}

/* ---------- MOCK DATA (замінити коли поїде сервер) ---------- */
const MOCK_MANAGERS = [];
// Live cache of users (populated from Firestore on login and after user changes)
window.__users = [];
// Список користувачів: у сесійному кеші до 10 хв (зміни ролей/імен видно після дій на сторінці «Користувачі» — вона просить force).
async function refreshUserCache(force){
  const K = "alexa_users_v1";
  try {
    if (!force){
      const raw = sessionStorage.getItem(K);
      if (raw){ const o = JSON.parse(raw); if (o && Date.now()-o.t < 600000 && Array.isArray(o.u) && o.u.length){ window.__users = o.u; return; } }
    }
  } catch(_){}
  try { window.__users = await listUsers(); try { sessionStorage.setItem(K, JSON.stringify({ t:Date.now(), u:window.__users })); } catch(_){} }
  catch(ex){ console.warn("userCache:", ex); window.__users = []; }
}
function usersAll(){ return window.__users || []; }
function managersList(){ return usersAll().filter(u => u.role===ROLES.MANAGER); }

function startCallsSubscription(user){
  if (window.__callsSub) return;
  if (!user || !user.email) return;
  const isAdminPlus = ["developer","main_admin","admin"].includes(user.role);
  try {
    const base = db.collection("calls");
    const query = isAdminPlus
      ? base.orderBy("startedAt","desc")
      : base.where("managerEmail","==", user.email);  // без orderBy: where+orderBy по разным полям требует composite index → permission/failed-precondition
    window.__callsSub = query.onSnapshot(snap => {
      window.__callsLoaded = true;
      window.__calls = snap.docs.map(d => Object.assign({ id: d.id }, d.data()))
        .sort((a,b) => String(b.startedAt||"").localeCompare(String(a.startedAt||"")));
      window.dispatchEvent(new Event(CALLS_CHANGED_EVT));
    }, err => {
      console.warn("calls subscribe:", err);
      window.__callsLoaded = true;
      window.__calls = [];
      window.dispatchEvent(new Event(CALLS_CHANGED_EVT));
    });
  } catch (ex) { console.warn(ex); }
}

// Локальне сховище браузера (IndexedDB): великі «незмінні» дані (розшифровка й аналіз завершених розмов) читаються з бази ОДИН раз
// і далі беруться з пристрою, поки розмова не змінилась (підпис = статус+updatedAt+оцінка). Нове чи змінене — читається заново.
const idbKV = (function(){
  let p = null;
  function open(){
    if (p) return p;
    p = new Promise((res,rej)=>{
      try {
        const r = indexedDB.open("alexa-cache", 1);
        r.onupgradeneeded = ()=>{ r.result.createObjectStore("kv"); };
        r.onsuccess = ()=>res(r.result);
        r.onerror = ()=>rej(r.error);
      } catch(e){ rej(e); }
    });
    return p;
  }
  return {
    async get(k){ try { const d = await open(); return await new Promise(res=>{ const q = d.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined); }); } catch(_){ return undefined; } },
    async set(k,v){ try { const d = await open(); await new Promise(res=>{ const tx = d.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>res(); tx.onabort=()=>res(); }); } catch(_){} },
    async prune(max){   // лишаємо не більше max найсвіжіших записів
      try {
        const d = await open();
        const rows = await new Promise(res=>{ const out=[]; const q = d.transaction("kv").objectStore("kv").openCursor(); q.onsuccess=()=>{ const c=q.result; if (c){ out.push({k:c.key, at:(c.value&&c.value.at)||0}); c.continue(); } else res(out); }; q.onerror=()=>res([]); });
        if (rows.length <= max) return;
        rows.sort((a,b)=>a.at-b.at);
        const del = rows.slice(0, rows.length-max);
        await new Promise(res=>{ const tx = d.transaction("kv","readwrite"); const s = tx.objectStore("kv"); del.forEach(r=>s.delete(r.k)); tx.oncomplete=()=>res(); tx.onerror=()=>res(); tx.onabort=()=>res(); });
      } catch(_){}
    },
  };
})();
function tsKey(v){ try { return v && v.toMillis ? v.toMillis() : String(v); } catch(_){ return ""; } }
// Читає через локальний кеш: fetcher() викликається лише якщо запису нема або підпис змінився.
async function cachedRead(key, sig, fetcher){
  if (sig){
    const hit = await idbKV.get(key);
    if (hit && hit.sig === sig && hit.data !== undefined) return hit.data;
  }
  const data = await fetcher();
  if (sig && data !== undefined && data !== null){ await idbKV.set(key, { sig, data, at: Date.now() }); idbKV.prune(80); }
  return data;
}

function aiAllowed(){ return !(activeUser && activeUser.role===ROLES.MANAGER && activeUser.aiBlocked); }
async function startCallAnalysis(c){
  if (!aiAllowed()){ toast("Доступ до ІІ закрито адміністратором","err"); return false; }
  const ok = await confirmModal("Точно запустити аналіз?",
    "«"+(c.client||c.title||"розмова")+"» піде в обробку, і ІІ витратить гроші на цей аналіз. Запускай, якщо справді потрібно.", "Так, запустити аналіз");
  if (!ok) return false;
  const upd = c.transcriptReady
    ? { status:"queued_for_analysis", stage:"waiting_ai", manualStart:false, error:null }
    : { status: c.audioReady ? "queued" : "ended", stage:"waiting_worker", manualStart:true, error:null };
  upd.restartedBy = activeUser.uid; upd.restartedAt = firebase.firestore.FieldValue.serverTimestamp();
  await db.collection("calls").doc(c.id).update(upd);

  return true;
}

function periodStart(key){
  const d=new Date();
  if (key==="today")  { d.setHours(0,0,0,0); return d; }
  if (key==="week")   { d.setDate(d.getDate()-6); d.setHours(0,0,0,0); return d; }
  if (key==="month")  { d.setDate(d.getDate()-29); d.setHours(0,0,0,0); return d; }
  if (key==="year")   { d.setDate(d.getDate()-364); d.setHours(0,0,0,0); return d; }
  return new Date(0);
}
function overviewFiltered(periodKey){
  const from = periodStart(periodKey);
  return callsAll().filter(c => !c.isTest && new Date(c.startedAt) >= from);
}

/* ---------- Підсвітка «зверни увагу» (жовта/червона обводка) ---------- */
let _attnUnsubs = [];
function watchAttention(user, settingsItem, gearBtn){
  _attnUnsubs.forEach(u=>{ try{u();}catch(_){} }); _attnUnsubs = [];
  const isAdminPlus = ["admin","main_admin","developer"].includes(user.role);
  if (isAdminPlus && settingsItem){
    let limit = 10, u = {};
    const paint = ()=>{
      const spent = Math.max(Number(u.analysisCostUsd||0)+Number(u.chatCostUsd||0), Number(u.realCostUsd||0));
      const pct = limit>0 ? spent/limit*100 : 0;
      settingsItem.classList.toggle("has-danger", pct>=100);
      settingsItem.classList.toggle("has-warn", pct>=90 && pct<100);
      settingsItem.title = pct>=100 ? "Ліміт ІІ вичерпано — ІІ зупинено" : pct>=90 ? "Витрачено понад 90% ліміту ІІ" : "";
    };
    const d = new Date(); const mk = d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0");
    _attnUnsubs.push(db.collection("settings").doc("ai").onSnapshot(sn=>{ const c = sn.exists ? sn.data() : {}; if (c.limitUsd) limit = Number(c.limitUsd); paint(); }, ()=>{}));
    _attnUnsubs.push(db.collection("usage").doc(mk).onSnapshot(sn=>{ u = sn.exists ? sn.data() : {}; paint(); }, ()=>{}));
  }
  if (user.role === "manager" && gearBtn){
    _attnUnsubs.push(db.collection("channels").doc(user.email).onSnapshot(sn=>{
      const ok = sn.exists && sn.data().status === "active";
      gearBtn.classList.toggle("has-warn", !ok);
      gearBtn.title = ok ? "Налаштування профілю" : (sn.exists ? "Потрібно підключити YouTube знову" : "Підключи свій YouTube канал");
    }, ()=>{}));
  }
}

function fmtDateTimeShort(iso){
  if (!iso) return "—";
  try {
    const d = new Date(iso);
    const dd = String(d.getDate()).padStart(2,"0");
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const yy = d.getFullYear();
    const hh = String(d.getHours()).padStart(2,"0");
    const mi = String(d.getMinutes()).padStart(2,"0");
    return `${dd}.${mm}.${yy} ${hh}:${mi}`;
  } catch(e){ return String(iso); }
}

// Реальні аналізи готових розмов (analysis/main), з кешем
const __anCache = new Map();
async function loadAnalyses(calls){
  const done = calls.filter(c=>c.status==="done");
  await Promise.all(done.map(async c=>{
    const sig = String(c.score)+"|"+String(c.updatedAt);
    const hit = __anCache.get(c.id); if (hit && hit.sig===sig) return;
    let a=null;
    if (c.digest && typeof c.digest === "object"){       // зріз аналізу вже в документі розмови — 0 додаткових читань
      __anCache.set(c.id,{sig,a:{ weaknesses:(c.digest.w||[]), criteria:(c.digest.c||[]) }});
      return;
    }
    try { const sn = await db.collection("calls").doc(c.id).collection("analysis").doc("main").get(); if (sn.exists) a = sn.data(); } catch(_){}
    __anCache.set(c.id,{sig,a});
  }));
  return done.map(c=>({call:c, a:(__anCache.get(c.id)||{}).a})).filter(x=>x.a);
}

const PERIODS = [
  { key:"today", label:"Сьогодні" },
  { key:"week",  label:"Тиждень" },
  { key:"month", label:"Місяць" },

];

function setOverviewPeriod(k){ localStorage.setItem("alexa_period_overview", k); }

// У середню оцінку йдуть лише повні діагностики (sales). Дожим і кваліфікація (ЦА чи ні) — окремо, у середню не входять.
// Старі розмови без поля format вважаємо повними.
function isFullCall(c){ return !c.format || c.format==="sales" || c.format==="offline"; }
function renderOverview(root){
  const period = getOverviewPeriod();
  const calls  = overviewFiltered(period);
  const done   = calls.filter(c=>c.status==="done" && !c.isTest);
  const inWork = calls.filter(CALL_TABS.find(t=>t.key==="working").match);
  const avg    = done.length ? Math.round(done.reduce((s,c)=>s+(c.score||0),0)/done.length) : 0;
  const periodLabel = (PERIODS.find(p=>p.key===period)||PERIODS[0]).label.toLowerCase();

  // Останні 3 розмови (готові або в процесі)
  const recent = calls.slice().sort((a,b)=> new Date(b.startedAt)-new Date(a.startedAt)).slice(0,5);

  const seg = el("div",{class:"period-seg"},
    PERIODS.map(p => el("button",
      { class: p.key===period?"is-active":"",
        onclick: ()=>{ setOverviewPeriod(p.key); renderOverview(root); } },
      p.label)));

  const leftBlock = el("div",{class:"card"});
  function paintLeft(list, loading){
    // Групуємо слабкі місця по розмові: 1 блок = 1 розмова (не 1 момент).
    const byCall = new Map();
    list.forEach(({call,a}) => {
      const ws = a.weaknesses || [];
      if (!ws.length) return;
      const g = byCall.get(call.id) || { call, weaknesses: [], critCount: 0 };
      ws.forEach(w => { g.weaknesses.push(w); if (w.severity === "critical") g.critCount++; });
      byCall.set(call.id, g);
    });
    const groups = Array.from(byCall.values());
    // Сортування: спочатку з критичними (більше критичних — вище), потім за свіжістю.
    groups.sort((x,y) => (y.critCount - x.critCount) || (new Date(y.call.startedAt) - new Date(x.call.startedAt)));
    const anyCrit = groups.some(g => g.critCount > 0);
    const shown = groups.slice(0, 3);
    const plr = (n,a,b,c) => (n%10===1 && n%100!==11) ? a : (n%10>=2 && n%10<=4 && (n%100<10||n%100>=20)) ? b : c;
    leftBlock.replaceChildren(
      el("div",{class:"section-title"},
        el("span",{}, isMgrView() ? (anyCrit?"Мої критичні помилки":"Мої слабкі місця") : (anyCrit?"Критичні помилки менеджерів":"Моменти менеджерів"))),
      el("div",{}, loading ? el("div",{class:"empty"}, "Завантаження…")
      : shown.length === 0
        ? el("div",{class:"empty"}, "За цей період проблемних моментів немає. Усе чисто.")
        : shown.map(g => {
            const call = g.call;
            const mgr  = userByEmail(call.managerEmail);
            const total = g.weaknesses.length;
            const isCrit = g.critCount > 0;
            const titleTxt = call.client || call.title || "(без назви)";
            const subParts = [mgr.name || call.managerEmail];
            if (isCrit) subParts.push(g.critCount + " критичних · " + total + " всього");
            else        subParts.push(total + " " + plr(total,"слабке місце","слабкі місця","слабких місць"));
            const sortedW = g.weaknesses.slice().sort((a,b) => ((b.severity==="critical")|0) - ((a.severity==="critical")|0));
            const previewItems = sortedW.slice(0, 2).map(w => (w.title||"").trim()).filter(Boolean);
            const rest = total - previewItems.length;
            const previewTxt = previewItems.join(" · ") + (rest > 0 ? "  · +"+rest+" ще" : "");
            return el("div",{class:"sev-row"+(isCrit?" is-danger":""), onclick:()=>{ callDetailState.tab = "weak"; location.hash = "#/calls/"+call.id; }},
              userAva(mgr),
              el("div",{style:"min-width:0;"},
                el("div",{class:"sev-row__title"}, titleTxt),
                el("div",{class:"sev-row__sub"}, subParts.join(" · ")),
                previewTxt ? el("div",{class:"sev-row__sub",style:"margin-top:6px;color:var(--text);opacity:.85;line-height:1.4;"}, previewTxt) : null),
              el("div",{style:"text-align:right;align-self:start;"},
                el("div",{class:"muted xs"}, call.startedAt?fmtTime(call.startedAt):""))
            );
          }))
    );
  }
  paintLeft([], true);
  loadAnalyses(calls).then(list => { if (document.body.contains(leftBlock)) paintLeft(list,false); });

  const rightBlock = el("div",{class:"card"},
    el("div",{class:"section-title"},
      el("span",{},"Останні розмови"),
      el("span",{class:"muted small"}, "за "+periodLabel)),
    recent.length===0
      ? el("div",{class:"empty"}, "За цей період розмов ще немає.")
      : recent.map(c => {
          const mgr = userByEmail(c.managerEmail);
          const sc  = c.score;
          const sub = (c.client || c.title || "(без назви)") + " · " + fmtTimeRange(c.startedAt, c.durationSec, c.status) + (c.summary ? " · " + (c.summary.length>36?c.summary.slice(0,36)+"…":c.summary) : "");
          return el("div",{class:"recent-row", onclick:()=>{ location.hash = "#/calls/"+c.id; }},
            userAva(mgr),
            el("div",{style:"min-width:0;"},
              el("div",{class:"recent-row__name"}, mgr.name || mgr.email),
              el("div",{class:"recent-row__sub"}, sub)),
            el("div",{style:"justify-self:end;"}, statusBadge(c.status)),
            sc!=null ? scoreRing(sc, 44) : el("div",{})
          );
        })
  );

  root.replaceChildren(
    el("div",{class:"page-header"},
      el("h1",{class:"page-title"},"Огляд"),
